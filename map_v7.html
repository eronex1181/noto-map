<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noto CSMap（令和7年・軽量版）</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<style>
html,body{height:100%;margin:0}
#map{height:100%;background:#f3f3f3}
.legend{background:#fff;padding:6px 10px;line-height:18px;box-shadow:0 0 15px rgba(0,0,0,.2)}
.legend i{width:18px;height:18px;float:left;margin-right:8px;opacity:.9}
#msg{position:absolute;left:0;right:0;top:8px;text-align:center;color:#666;font:14px/1.6 system-ui;z-index:9999}
.search-tag{display:inline-block;margin:6px;padding:2px 8px;border-radius:999px;font-size:12px;color:#fff;background:#607d8b;line-height:1.4}
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">地図を初期化中…</div>

<script>
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s);});}
(async()=>{
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js");
  init();
})();

function init(){
  document.getElementById('msg').remove();
  const map = L.map('map').setView([37.3,136.9],11);

  const notoCS = L.tileLayer('https://rinya.geospatial.jp/tile/csmaptile_noto/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© 林野庁'}).addTo(map);
  const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,opacity:.6,attribution:'© 国土地理院'});
  const ctl = L.control.layers({'Noto CSMap':notoCS},{'淡色地図':gsiPale},{collapsed:false}).addTo(map);
  L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

  const nf = new Intl.NumberFormat('ja-JP');
  const fmtYen=v=>v?nf.format(v)+'円/㎡':'-';
  const fmtPct=v=>v?Number(v).toFixed(1)+'%':'-';

  // === 大字 ===
  fetch('./kyoukai.geojson').then(r=>r.json()).then(d=>{
    const Lyr=L.geoJSON(d,{style:{color:'green',dashArray:'4,4',weight:1.2},
      onEachFeature:(f,l)=>l.bindPopup(`<b>${f.properties.市町村??''}</b><br>${f.properties.大字??''}`)});
    ctl.addOverlay(Lyr,'大字境界');
  });

  // === 避難所（デフォルト非表示） ===
  fetch('./17000_1.geojson').then(r=>r.json()).then(d=>{
    const ic=L.icon({iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png',iconSize:[25,41],iconAnchor:[12,41]});
    const Lyr=L.geoJSON(d,{pointToLayer:(f,lat)=>L.marker(lat,{icon:ic}).bindPopup(`<b>${f.properties['施設・場所名']??''}</b>`)});
    ctl.addOverlay(Lyr,'指定避難場所（更新2025-07-09）');
  });

  // === ため池（デフォルト非表示） ===
  fetch('./ため池.geojson').then(r=>r.json()).then(d=>{
    const ic=L.icon({iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-blue.png',iconSize:[25,41],iconAnchor:[12,41]});
    const Lyr=L.geoJSON(d,{pointToLayer:(f,lat)=>L.marker(lat,{icon:ic}).bindPopup(`<b>${f.properties['名称']??''}</b>`)});
    ctl.addOverlay(Lyr,'ため池');
  });

  // === バス停 ===
  fetch('./P11-22_17.geojson').then(r=>r.json()).then(d=>{
    const ic=L.divIcon({html:'🚌',className:'',iconSize:[24,24],iconAnchor:[12,12]});
    const Lyr=L.geoJSON(d,{pointToLayer:(f,lat)=>L.marker(lat,{icon:ic}).bindPopup(`<b>${f.properties['停留所名']??''}</b>`)});
    Lyr.addTo(map);
    ctl.addOverlay(Lyr,'バス停（令和4年）');
  });

  // === 地価（令和7年） ===
  fetch('./石川地価2025.geojson').then(r=>r.json()).then(d=>{
    const ic=L.icon({iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-orange.png',iconSize:[25,41],iconAnchor:[12,41]});
    const Lyr=L.geoJSON(d,{pointToLayer:(f,lat)=>{
      const p=f.properties??{};
      const html=`<b>地価調査（令和7年・石川）</b><br>${p['市区町村名']??''} ${p['所在地']??''}<br>
      <b>価格:</b>${fmtYen(p['価格（円/m2）']??p['価格'])}<br>
      <b>対前年変動率:</b>${fmtPct(p['対前年変動率（％）']??p['対前年変動率'])}`;
      return L.marker(lat,{icon:ic}).bindPopup(html);
    }});
    Lyr.addTo(map);
    ctl.addOverlay(Lyr,'地価調査（令和7年・石川）');
  });

  // === 土砂災害 ===
  fetch('./dosya.geojson').then(r=>r.json()).then(d=>{
    const c=v=>v==1?'#ffff00':v==2?'#ff0000':'#888';
    const n=v=>v==1?'イエローゾーン':v==2?'レッドゾーン':'その他';
    const Lyr=L.geoJSON(d,{style:f=>({color:c(f.properties.A33_002),weight:2,fillOpacity:.25}),
      onEachFeature:(f,l)=>l.bindPopup(`${n(f.properties.A33_002)}<br>${f.properties.A33_005??''}`)});
    Lyr.addTo(map);
    ctl.addOverlay(Lyr,'土砂災害警戒区域');
  });

  // === 凡例 + 現在地 ===
  const leg=L.control({position:'bottomright'});
  leg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML=
    '<i style="background:#ffff00;"></i> イエロー<br>'+
    '<i style="background:#ff0000;"></i> レッド<br>'+
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-orange.png" style="height:18px;"> 地価（令和7年）';return d;};
  leg.addTo(map);

  if(L.control.locate)L.control.locate({flyTo:true,strings:{title:'現在地'}}).addTo(map);
}
</script>
</body>
</html>
