<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noto CSMap（遅延ロード・クラスタ・土砂災害・地価〈令和7年〉）</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{height:100%;margin:0}
  #map{height:100%;background:#f3f3f3}
  .legend{background:#fff;padding:6px 10px;line-height:18px;box-shadow:0 0 15px rgba(0,0,0,.2)}
  .legend i{width:18px;height:18px;float:left;margin-right:8px;opacity:.9}
  .bus-icon{font-size:22px;width:26px;height:26px;line-height:26px;text-align:center;transform:translate(-13px,-13px);text-shadow:0 0 2px rgba(255,255,255,.85)}
  #msg{position:absolute;left:0;right:0;top:8px;text-align:center;color:#666;font:14px/1.6 system-ui;z-index:9999}
  .search-tag{display:inline-block;margin:6px 6px 4px 6px;padding:2px 8px;border-radius:999px;font-size:12px;color:#fff;background:#607d8b;line-height:1.4;vertical-align:middle}
  .leaflet-control-search .search-input{margin-left:6px}
  .leaflet-top.leaflet-left .leaflet-control-search{ margin-bottom:30px !important; }
  @media (max-width:640px){ .leaflet-top.leaflet-left .leaflet-control-search{ margin-bottom:24px !important; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">地図を初期化中…</div>

<script>
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s);});}
(async()=>{
  try{ await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"); }
  catch{ try{ await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"); }
         catch{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"); } }
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
  init();
})();

function init(){
  const msg = document.getElementById('msg'); if (msg) msg.remove();
  const map = L.map('map').setView([37.3,136.9],11);

  // --- panes ---
  map.createPane('boundaryPane');  map.getPane('boundaryPane').style.zIndex = 421;
  map.createPane('palePane');      map.getPane('palePane').style.zIndex = 425;
  map.createPane('zonesPane');     map.getPane('zonesPane').style.zIndex = 428;
  map.createPane('markersPane');   map.getPane('markersPane').style.zIndex = 430;

  // --- base layers ---
  const notoCS = L.tileLayer('https://rinya.geospatial.jp/tile/csmaptile_noto/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© 林野庁'}).addTo(map);
  const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,opacity:.6,pane:'palePane',attribution:'© 国土地理院'});
  const ctl = L.control.layers({'Noto CSMap':notoCS},{'淡色地図':gsiPale},{collapsed:false}).addTo(map);
  L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

  // ---- helpers ----
  const z2h = s => (s ?? '').toString()
    .replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/\s+/g,' ').trim();
  const nf = new Intl.NumberFormat('ja-JP');
  const fmtYen = v=>{ if(v==null||v==='') return '-'; const n = Number(String(v).replace(/[,円¥\s]|\/?\s*m2/gi,'')); return Number.isFinite(n)? nf.format(n)+'円/㎡' : String(v); };
  const fmtPct = v=>{ if(v==null||v==='') return '-'; const n = Number(String(v).replace(/[,\s%％]/g,'')); return Number.isFinite(n)? n.toFixed(1)+'%' : String(v); };
  const decorateSearch=(control,label,color)=>{control.options.collapsed=false; const el=control._container||control.getContainer(); const tag=document.createElement('span'); tag.className='search-tag'; tag.textContent=label; if(color) tag.style.background=color; (el.querySelector('form')||el).insertBefore(tag,el.firstChild); return control;};

  // ====== Lazy overlays placeholders (初期OFF) ======
  const daijiGroup   = L.layerGroup();  ctl.addOverlay(daijiGroup,'大字境界');                    // 初期OFF（未addTo）
  const sheltersGroup= L.layerGroup();  ctl.addOverlay(sheltersGroup,'指定避難場所（更新2025-07-09）');
  const pondsGroup   = L.layerGroup();  ctl.addOverlay(pondsGroup,'ため池（クラスタ）');

  let daijiReady=false, sheltersReady=false, pondsReady=false;
  let daijiLayer=null, sheltersCluster=null, pondsCluster=null;

  // ===== バス停（初期ON・クラスタ） =====
  fetch('./P11-22_17.geojson?_=r7',{cache:'no-store'}).then(r=>r.json()).then(data=>{
    const ic = L.divIcon({html:'🚌',className:'bus-icon',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-12]});
    const cluster = L.markerClusterGroup({pane:'markersPane',disableClusteringAtZoom:16,spiderfyOnMaxZoom:true,showCoverageOnHover:false});
    const pickName = (p)=>{const ks=['名称','停留所名','バス停名','name','Name','停名','停留所']; for(const k of ks){if(p&&p[k]) return z2h(p[k]);}
      for(const [k,v] of Object.entries(p??{})){if(typeof v==='string'&&v.trim()) return z2h(v);} return '';};
    const buses = L.geoJSON(data,{
      pane:'markersPane',
      pointToLayer:(f,latlng)=>{ const p=f.properties??{}; p._bus_name = pickName(p); const m=L.marker(latlng,{icon:ic}); m.options.title=p._bus_name; return m; },
      onEachFeature:(f,l)=>{ const p=f.properties??{}, n=p._bus_name ?? ''; const skip=new Set(['名称','停留所名','バス停名','name','Name','停名','停留所']);
        const rest=Object.entries(p).filter(([k])=>!skip.has(k) && k!=='_bus_name').map(([k,v])=>`<b>${k}:</b> ${v}`).join('<br>');
        l.bindPopup(`<b>バス停（令和4年）</b>${n?`<br><b>名称:</b> ${n}`:''}${rest?`<br>${rest}`:''}`); }
    });
    cluster.addLayer(buses); map.addLayer(cluster); ctl.addOverlay(cluster,'バス停（令和4年）');

    const sBus = new L.Control.Search({layer: buses, propertyName:'_bus_name', textPlaceholder:'バス停名', marker:false, zoom:18, collapsed:false}).addTo(map);
    decorateSearch(sBus,'🚌 バス停','#6a1b9a');
  });

  // ===== 地価（令和7年・初期ON・クラスタ／検索UIなし） =====
  fetch('./石川地価2025.geojson?_=r7',{cache:'no-store'}).then(r=>r.json()).then(data=>{
    const icon = L.icon({iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-orange.png',shadowUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-shadow.png',iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[0,-35]});
    const cluster = L.markerClusterGroup({pane:'markersPane',disableClusteringAtZoom:16,spiderfyOnMaxZoom:true,showCoverageOnHover:false});
    const land = L.geoJSON(data,{
      pane:'markersPane',
      pointToLayer:(f,latlng)=>{ const p=f.properties??{}; const m=L.marker(latlng,{icon}); m.options.title=(p['市区町村名']||'')+' '+(p['所在地']||''); return m; },
      onEachFeature:(f,l)=>{ const p=f.properties??{}; const price=fmtYen(p['価格（円/m2）']??p['価格']); const yoy=fmtPct(p['対前年変動率（％）']??p['対前年変動率']);
        l.bindPopup(`<b>地価調査（令和7年）</b><br><b>所在地:</b> ${(p['市区町村名']||'')+' '+(p['所在地']||'')}<br><b>用途:</b> ${p['用途']??'-'}<br><b>価格:</b> ${price}<br><b>対前年変動率:</b> ${yoy}`); }
    });
    cluster.addLayer(land); map.addLayer(cluster); ctl.addOverlay(cluster,'地価調査（令和7年・石川）');
    // ★検索UIは作成しない（ご要望）
  });

  // ===== 土砂災害（ポリゴン・初期ON） =====
  let sHazard=null;
  fetch('./dosya.geojson?_=r7',{cache:'no-store'}).then(r=>r.json()).then(data=>{
    const col=v=>(v==1||v==='1')?'#ffff00':(v==2||v==='2')?'#ff0000':'#888';
    const nm=v=>(v==1||v==='1')?'イエローゾーン':(v==2||v==='2')?'レッドゾーン':'その他';
    const danger = L.geoJSON(data,{
      pane:'zonesPane',
      style:f=>({color:col(f.properties.A33_002),weight:2,opacity:.9,fillOpacity:.25}),
      onEachFeature:(f,l)=>{
        const p=f.properties??{};
        const num = (p.A33_004??'').toString().split(/[-－―‐]/)[0].replace(/\D/g,'');
        const name = (p.A33_005??'').toString();
        l.options.title = `${num} ${name}`.trim();
        l.bindPopup(`<b>${nm(p.A33_002)}</b><br><b>箇所番号:</b> ${p.A33_004??'-'}<br><b>箇所名:</b> ${p.A33_005??'-'}`+(p.A33_009?`<br><b>市町村:</b> ${p.A33_009}`:''));
      }
    }).addTo(map);
    ctl.addOverlay(danger,'土砂災害警戒区域');

    sHazard = new L.Control.Search({layer: danger, propertyName:'title', textPlaceholder:'箇所番号 / 箇所名', marker:false, zoom:16, collapsed:false}).addTo(map);
    decorateSearch(sHazard,'⚠️ 土砂災害','#e53935');
  });

  // ===== 遅延ロード：ONされた時に初めてfetch =====
  map.on('overlayadd', e=>{
    // 大字
    if (e.layer===daijiGroup && !daijiReady){
      fetch('./kyoukai.geojson?_=r7',{cache:'no-store'}).then(r=>r.json()).then(data=>{
        daijiLayer = L.geoJSON(data,{
          pane:'boundaryPane',
          style:()=>({color:'green',dashArray:'4,4',weight:1.5,opacity:1}),
          onEachFeature:(f,l)=>{const p=f.properties??{}; l.options.title=z2h(`${p['大字']??''} ${p['市町村']??''}`);
            l.bindPopup(`<b>大字:</b> ${p['大字']??'-'}<br><b>市町村:</b> ${p['市町村']??'-'}`);}
        });
        daijiGroup.addLayer(daijiLayer);
        daijiReady=true;

        // 任意：検索（大字名）
        const s1 = new L.Control.Search({layer: daijiLayer, propertyName:'大字', textPlaceholder:'大字名', marker:false, zoom:14, collapsed:false}).addTo(map);
        decorateSearch(s1,'📚 大字','#2e7d32');
      });
    }

    // 指定避難場所
    if (e.layer===sheltersGroup && !sheltersReady){
      fetch('./17000_1.geojson?_=r7',{cache:'no-store'}).then(r=>r.json()).then(data=>{
        const icon = L.icon({iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png',iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[0,-35]});
        sheltersCluster = L.markerClusterGroup({pane:'markersPane',disableClusteringAtZoom:16,spiderfyOnMaxZoom:true,showCoverageOnHover:false});
        const shelters = L.geoJSON(data,{
          pane:'markersPane',
          pointToLayer:(f,latlng)=>{ const p=f.properties??{}; p._shelter_name = p['施設・場所名'] ?? p['名称'] ?? ''; const m=L.marker(latlng,{icon}); m.options.title=p._shelter_name; return m; },
          onEachFeature:(f,l)=>l.bindPopup(`<b>指定避難場所</b><br>${Object.entries(f.properties??{}).map(([k,v])=>`<b>${k}:</b> ${v}`).join('<br>')}`)
        });
        sheltersCluster.addLayer(shelters);
        sheltersGroup.addLayer(sheltersCluster);
        sheltersReady=true;

        // 任意：検索（施設・場所名）
        const s3 = new L.Control.Search({layer: shelters, propertyName:'_shelter_name', textPlaceholder:'施設・場所名', marker:false, zoom:17, collapsed:false}).addTo(map);
        decorateSearch(s3,'🏠 避難所','#388e3c');
      });
    }

    // ため池
    if (e.layer===pondsGroup && !pondsReady){
      fetch('./ため池.geojson?_=r7',{cache:'no-store'}).then(r=>r.json()).then(data=>{
        const icon = L.icon({iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-blue.png',iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[0,-35]});
        pondsCluster = L.markerClusterGroup({pane:'markersPane',disableClusteringAtZoom:16,spiderfyOnMaxZoom:true,showCoverageOnHover:false});
        const ponds = L.geoJSON(data,{
          pane:'markersPane',
          pointToLayer:(f,latlng)=>{ const p=f.properties??{}; p._pond_name = p.name ?? p['名称'] ?? p['Name'] ?? ''; const m=L.marker(latlng,{icon}); m.options.title=p._pond_name; return m; },
          onEachFeature:(f,l)=>{ const p=f.properties??{}, nm=p._pond_name ?? ''; const skip=new Set(['name','名称','Name']);
            const rest=Object.entries(p).filter(([k])=>!skip.has(k) && k!=='_pond_name').map(([k,v])=>`<b>${k}:</b> ${v}`).join('<br>');
            l.bindPopup(`<b>ため池</b>${nm?`<br><b>name:</b> ${nm}`:''}${rest?`<br>${rest}`:''}`); }
        });
        pondsCluster.addLayer(ponds);
        pondsGroup.addLayer(pondsCluster);
        pondsReady=true;

        // 任意：検索（ため池名）
        const s4 = new L.Control.Search({layer: ponds, propertyName:'_pond_name', textPlaceholder:'ため池名', marker:false, zoom:18, collapsed:false}).addTo(map);
        decorateSearch(s4,'💧 ため池','#1976d2');
      });
    }
  });

  // （必要ならOFF時のDOM負荷をさらに下げる：完全解放版）
  // map.on('overlayremove', e=>{
  //   if (e.layer===sheltersGroup && sheltersCluster){ sheltersGroup.removeLayer(sheltersCluster); sheltersCluster=null; sheltersReady=false; }
  //   if (e.layer===pondsGroup    && pondsCluster   ){ pondsGroup.removeLayer(pondsCluster);    pondsCluster=null;    pondsReady=false; }
  //   if (e.layer===daijiGroup    && daijiLayer     ){ daijiGroup.removeLayer(daijiLayer);     daijiLayer=null;     daijiReady=false; }
  // });

  // 凡例
  const legend=L.control({position:'bottomright'}); legend.onAdd=()=>{const d=L.DomUtil.create('div','legend'); d.innerHTML =
    '<i style="background:#ffff00;"></i> イエローゾーン<br>'+
    '<i style="background:#ff0000;"></i> レッドゾーン<br>'+
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png" style="height:18px;vertical-align:middle;margin-right:6px;"> 指定避難場所<br>'+
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-blue.png" style="height:18px;vertical-align:middle;margin-right:6px;"> ため池<br>'+
    '<span style="font-size:18px;vertical-align:middle;margin-right:6px;">🚌</span> バス停（令和4年）<br>'+
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-orange.png" style="height:18px;vertical-align:middle;margin-right:6px;"> 地価調査（令和7年）'; return d; };
  legend.addTo(map);

  // 現在地
  if (L.control.locate){ L.control.locate({position:'topleft',flyTo:true,strings:{title:'現在地を表示'},locateOptions:{enableHighAccuracy:true}}).addTo(map); }
}
</script>
</body>
</html>
