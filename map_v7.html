"<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noto CSMap（今昔マップ・土砂災害・地価2025・くま目撃情報2025・洪水浸水想定区域）</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{height:100%;margin:0}
  #map{height:100%;background:#f3f3f3}
  .legend{background:#fff;padding:6px 10px;line-height:18px;box-shadow:0 0 15px rgba(0,0,0,.2);font-size:12px;max-height:55vh;overflow-y:auto}
  .legend i{width:18px;height:18px;float:left;margin-right:8px;opacity:.9}
  .legend-title{font-weight:bold;margin:2px 0 4px}
  .legend hr{margin:5px 0;border:none;border-top:1px solid #ccc}
  .bus-icon{font-size:22px;width:26px;height:26px;line-height:26px;text-align:center;transform:translate(-13px,-13px);text-shadow:0 0 2px rgba(255,255,255,.85)}
  #msg{position:absolute;left:0;right:0;top:8px;text-align:center;color:#666;font:14px/1.6 system-ui;z-index:9999}

  /* 検索ラベル */
  .search-tag{
    display:inline-block;margin:6px 6px 4px 6px;padding:2px 8px;border-radius:999px;
    font-size:12px;color:#fff;background:#607d8b;line-height:1.4;vertical-align:middle
  }
  .leaflet-control-search .search-input{margin-left:6px}

  /* レイヤ一覧を少し見やすくする */
  .leaflet-control-layers{
    max-height:72vh;
    overflow-y:auto;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">地図を初期化中…</div>

<script>
function loadScript(src){
  return new Promise((ok,ng)=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=ok;
    s.onerror=ng;
    document.head.appendChild(s);
  });
}

(async()=>{
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js");
  }catch{
    try{
      await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js");
    }catch{
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js");
    }
  }

  await loadScript("https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js");
  await loadScript("https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js");
  init();
})();

function init(){
  const msg = document.getElementById('msg');
  if (msg) msg.remove();

  const map = L.map('map').setView([37.3,136.9],11);

  // panes
  // 背景地図はすべてベクタやマーカーより下に表示
  map.createPane('backgroundPane');
  map.getPane('backgroundPane').style.zIndex = 200;

  // 国土地理院の淡色地図は、古地図・CS立体図・航空写真の上に
  // 半透明で重ねるため、専用の上層ペインに配置する
  map.createPane('gsiOverlayPane');
  map.getPane('gsiOverlayPane').style.zIndex = 210;
  map.getPane('gsiOverlayPane').style.pointerEvents = 'none';

  // 洪水浸水想定区域は背景地図より上、大字境界より下に表示
  map.createPane('floodPane');
  map.getPane('floodPane').style.zIndex = 418;
  map.getPane('floodPane').style.pointerEvents = 'none';

  map.createPane('boundaryPane');
  map.getPane('boundaryPane').style.zIndex = 421;

  map.createPane('zonesPane');
  map.getPane('zonesPane').style.zIndex = 428;

  map.createPane('markersPane');
  map.getPane('markersPane').style.zIndex = 430;

  // ============================================================
  // 背景地図
  //
  // ・初期状態では「能登半島CS立体図」と「国土地理院 淡色地図（透過）」を表示
  // ・国土地理院淡色地図は重ね合わせ用として単独でも表示可能
  // ・それ以外の背景地図は同時に1種類だけ表示
  // ・すべてチェックを外して背景なしにもできる
  // ============================================================

  const notoCS = L.tileLayer(
    'https://rinya.geospatial.jp/tile/csmaptile_noto/{z}/{x}/{y}.png',
    {
      minZoom:2,
      maxZoom:18,
      pane:'backgroundPane',
      attribution:'© 林野庁'
    }
  );

  const gsiPhoto = L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
    {
      minZoom:2,
      maxZoom:18,
      pane:'backgroundPane',
      attribution:'© 国土地理院'
    }
  );

  const gsiPale = L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    {
      minZoom:2,
      maxZoom:18,
      opacity:0.6,
      pane:'gsiOverlayPane',
      attribution:'© 国土地理院'
    }
  );

  // 洪水浸水想定区域（想定最大規模・石川県）
  const floodHazard = L.tileLayer(
    'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_pref_data/17/{z}/{x}/{y}.png',
    {
      minZoom:2,
      maxZoom:18,
      opacity:0.6,
      pane:'floodPane',
      attribution:'洪水浸水想定区域（想定最大規模） © 国土交通省・都道府県等'
    }
  );

  // 今昔マップ「金沢・富山」
  // 今昔マップはTMS方式のため、Y座標に {-y} を使用
  function kjMapLayer(ageFolder){
    return L.tileLayer(
      `https://ktgis.net/kjmapw/kjtilemap/kanazawa/${ageFolder}/{z}/{x}/{-y}.png`,
      {
        minZoom:8,
        maxZoom:18,
        maxNativeZoom:16,
        pane:'backgroundPane',
        attribution:'今昔マップ on the web（谷 謙二）'
      }
    );
  }

  const kj1909 = kjMapLayer('2man');
  const kj1930 = kjMapLayer('00');
  const kj1968 = kjMapLayer('01');
  const kj1981 = kjMapLayer('02');
  const kj1994 = kjMapLayer('03');

  const backgroundMaps = {
    '<b style="color:#c62828;">★【重ね合わせ】国土地理院 淡色地図（透過）</b>': gsiPale,
    '【背景】能登半島CS立体図': notoCS,
    '【背景】地理院 航空写真': gsiPhoto,
    '【古地図】金沢・富山 1909–1910年': kj1909,
    '【古地図】金沢・富山 1930年': kj1930,
    '【古地図】金沢・富山 1968–1969年': kj1968,
    '【古地図】金沢・富山 1981–1985年': kj1981,
    '【古地図】金沢・富山 1994–2001年': kj1994
  };

  // ベースレイヤではなくオーバーレイとして登録することで、
  // 各背景地図をチェック解除でき、国土地理院淡色地図だけ重ね合わせ可能にする
  const ctl = L.control.layers(
    null,
    backgroundMaps,
    {collapsed:false}
  ).addTo(map);

  // 洪水浸水想定区域は初期OFF。チェック時だけ表示する
  ctl.addOverlay(floodHazard,'洪水浸水想定区域（想定最大規模）');

  // 初期表示
  // どちらもオーバーレイ扱いのため、チェックを外して非表示にできる
  notoCS.addTo(map);
  gsiPale.addTo(map);

  // 国土地理院淡色地図は、透過した重ね合わせ用として独立してON/OFF可能。
  // 能登半島CS立体図・航空写真・各年代の古地図は、同時に1種類だけ表示する。
  // したがって、表示できる組み合わせは次のいずれかになる。
  //   1. 国土地理院淡色地図 + CS立体図／航空写真／古地図のうち1種類
  //   2. 国土地理院淡色地図だけ
  //   3. CS立体図／航空写真／古地図のうち1種類だけ
  //   4. 背景地図なし
  const exclusiveBackgroundLayers = new Set([
    notoCS,
    gsiPhoto,
    kj1909,
    kj1930,
    kj1968,
    kj1981,
    kj1994
  ]);

  let changingBackground = false;

  // Leafletのチェック操作中に別レイヤを削除すると、地図上の表示と
  // チェック欄が一時的にずれるため、操作終了後に一覧を再描画する。
  function syncLayerControl(){
    window.setTimeout(()=>{
      if (ctl && typeof ctl._update === 'function') ctl._update();
    },0);
  }

  map.on('overlayadd', e=>{
    if (changingBackground || !exclusiveBackgroundLayers.has(e.layer)) return;

    changingBackground = true;

    for(const layer of exclusiveBackgroundLayers){
      if(layer !== e.layer && map.hasLayer(layer)){
        map.removeLayer(layer);
      }
    }

    changingBackground = false;

    // 国土地理院淡色地図が表示中なら、常に古地図等の上に保つ
    if(map.hasLayer(gsiPale) && typeof gsiPale.bringToFront === 'function'){
      gsiPale.bringToFront();
    }

    syncLayerControl();
  });

  // 手動でチェックを外した場合も、現在表示中のレイヤだけにチェックを合わせる。
  map.on('overlayremove', e=>{
    if(e.layer === gsiPale || exclusiveBackgroundLayers.has(e.layer)){
      syncLayerControl();
    }
  });

  map.on('overlayadd', e=>{
    if(e.layer === gsiPale && typeof gsiPale.bringToFront === 'function'){
      gsiPale.bringToFront();
      syncLayerControl();
    }
  });

  L.control.scale({
    position:'bottomleft',
    imperial:false
  }).addTo(map);

  // 正規化＆title補助
  const z2h = s => (s ?? '')
    .toString()
    .replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/\s+/g,' ')
    .trim();

  const normKey = k => z2h(k)
    .replace(/[ \t\r\n]/g,'')
    .replace(/[／\/]/g,'/')
    .replace(/[％%]/g,'%')
    .replace(/㎡/g,'m2')
    .toLowerCase();

  const pickKey = (obj, keysOrRegs) => {
    if (!obj) return '';
    const keyMap = new Map(Object.keys(obj).map(k=>[normKey(k),k]));

    for(const key of keysOrRegs){
      if(typeof key === 'string'){
        const normalized = normKey(key);
        if(keyMap.has(normalized)) return obj[keyMap.get(normalized)];
      }
    }

    const entries = Object.keys(obj).map(k=>[k,normKey(k)]);
    for(const pattern of keysOrRegs){
      if(pattern instanceof RegExp){
        const hit = entries.find(([,normalized])=>pattern.test(normalized));
        if(hit) return obj[hit[0]];
      }
    }
    return '';
  };

  const numberFormat = new Intl.NumberFormat('ja-JP');

  const fmtYen = value => {
    if(value==null || value==='') return '-';
    const n = Number(String(value).replace(/[,円¥\s]|\/?\s*m2/gi,''));
    return Number.isFinite(n) ? `${numberFormat.format(n)}円/㎡` : String(value);
  };

  const fmtPct = value => {
    if(value==null || value==='') return '-';
    const n = Number(String(value).replace(/[,\s%％]/g,''));
    return Number.isFinite(n) ? `${n.toFixed(1)}%` : String(value);
  };

  const setTitle = (layerOrFeat, title) => {
    const t = z2h(title);
    if (layerOrFeat?.options) layerOrFeat.options.title = t;
    if (layerOrFeat?.feature?.properties) layerOrFeat.feature.properties.title = t;
    else if (layerOrFeat?.properties) layerOrFeat.properties.title = t;
    return t;
  };

  // 検索UIのラベル付け＋常時展開
  function decorateSearch(control, label, color){
    control.options.collapsed = false;
    const el = control._container || control.getContainer();
    const tag = document.createElement('span');
    tag.className = 'search-tag';
    tag.textContent = label;
    if(color) tag.style.background = color;
    const form = el.querySelector('form') || el;
    form.insertBefore(tag, form.firstChild);
    return control;
  }

  // ===== 大字 =====
  fetch('./kyoukai.geojson',{cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error(`kyoukai.geojson: HTTP ${r.status}`);
      return r.json();
    })
    .then(data=>{
      const boundaryLayer = L.geoJSON(data,{
        pane:'boundaryPane',
        style:()=>({
          color:'green',
          dashArray:'4,4',
          weight:1.5,
          opacity:1,
          fillOpacity:0
        }),
        onEachFeature:(f,l)=>{
          const p=f.properties??{};
          setTitle(l,`${p['大字']??''} ${p['市町村']??''}`);
          l.bindPopup(
            `<b>大字:</b> ${p['大字']??'-'}<br>`+
            `<b>市町村:</b> ${p['市町村']??'-'}`
          );
        }
      }).addTo(map);

      ctl.addOverlay(boundaryLayer,'大字境界');

      const s1 = new L.Control.Search({
        layer: boundaryLayer,
        propertyName:'大字',
        textPlaceholder:'大字名',
        marker:false,
        zoom:14,
        collapsed:false
      }).addTo(map);

      decorateSearch(s1,'🗺️ 大字','#2e7d32');

      s1.on('search:locationfound', e=>{
        if (e.layer.getBounds){
          map.fitBounds(e.layer.getBounds(),{
            maxZoom:18,
            padding:[24,24]
          });
        }
      });
    })
    .catch(err=>console.error(err));

  // ===== 指定避難場所（クラスタ／施設・場所名で検索） =====
  fetch('./17000_1.geojson',{cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error(`17000_1.geojson: HTTP ${r.status}`);
      return r.json();
    })
    .then(data=>{
      const icon = L.icon({
        iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png',
        iconSize:[25,41],
        iconAnchor:[12,41],
        popupAnchor:[0,-35]
      });

      const cluster = L.markerClusterGroup({
        pane:'markersPane',
        disableClusteringAtZoom:16,
        spiderfyOnMaxZoom:true,
        showCoverageOnHover:false
      });

      const shelters = L.geoJSON(data,{
        pane:'markersPane',
        pointToLayer:(f,latlng)=>{
          const p=f.properties??{};
          p._shelter_name = p['施設・場所名'] ?? p['名称'] ?? '';
          const m=L.marker(latlng,{icon});
          setTitle(m,p._shelter_name);
          return m;
        },
        onEachFeature:(f,l)=>{
          l.bindPopup(
            `<b>指定避難場所</b><br>`+
            Object.entries(f.properties??{})
              .map(([k,v])=>`<b>${k}:</b> ${v}`)
              .join('<br>')
          );
        }
      });

      cluster.addLayer(shelters);
      map.addLayer(cluster);
      ctl.addOverlay(cluster,'指定避難場所（更新2025-07-09）');

      const s3 = new L.Control.Search({
        layer: shelters,
        propertyName:'_shelter_name',
        textPlaceholder:'施設・場所名',
        marker:false,
        zoom:17,
        collapsed:false
      }).addTo(map);

      decorateSearch(s3,'🏫 避難所','#388e3c');

      s3.on('search:locationfound', e=>{
        if (e.latlng) map.setView(e.latlng, Math.max(map.getZoom(),17));
        if (e.layer.openPopup) e.layer.openPopup();
      });
    })
    .catch(err=>console.error(err));

  // ===== ため池（クラスタ／名称検索） =====
  fetch('./ため池.geojson',{cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error(`ため池.geojson: HTTP ${r.status}`);
      return r.json();
    })
    .then(data=>{
      const icon = L.icon({
        iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-blue.png',
        iconSize:[25,41],
        iconAnchor:[12,41],
        popupAnchor:[0,-35]
      });

      const cluster = L.markerClusterGroup({
        pane:'markersPane',
        disableClusteringAtZoom:16,
        spiderfyOnMaxZoom:true,
        showCoverageOnHover:false
      });

      const ponds = L.geoJSON(data,{
        pane:'markersPane',
        pointToLayer:(f,latlng)=>{
          const p=f.properties??{};
          p._pond_name = p.name ?? p['名称'] ?? p['Name'] ?? '';
          const m=L.marker(latlng,{icon});
          setTitle(m,p._pond_name);
          return m;
        },
        onEachFeature:(f,l)=>{
          const p=f.properties??{};
          const nm=p._pond_name ?? '';
          const skip=new Set(['name','名称','Name']);
          const rest=Object.entries(p)
            .filter(([k])=>!skip.has(k) && k!=='_pond_name')
            .map(([k,v])=>`<b>${k}:</b> ${v}`)
            .join('<br>');

          l.bindPopup(
            `<b>ため池</b>`+
            `${nm?`<br><b>name:</b> ${nm}`:''}`+
            `${rest?`<br>${rest}`:''}`
          );
        }
      });

      cluster.addLayer(ponds);
      map.addLayer(cluster);
      ctl.addOverlay(cluster,'ため池（クラスタ）');

      const s4 = new L.Control.Search({
        layer: ponds,
        propertyName:'_pond_name',
        textPlaceholder:'ため池名',
        marker:false,
        zoom:18,
        collapsed:false
      }).addTo(map);

      decorateSearch(s4,'💧 ため池','#1976d2');

      s4.on('search:locationfound', e=>{
        if (e.latlng) map.setView(e.latlng, Math.max(map.getZoom(),18));
        if (e.layer.openPopup) e.layer.openPopup();
      });
    })
    .catch(err=>console.error(err));

  // ===== バス停（クラスタ／名称検索） =====
  fetch('./P11-22_17.geojson?_=now',{cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error(`P11-22_17.geojson: HTTP ${r.status}`);
      return r.json();
    })
    .then(data=>{
      const ic = L.divIcon({
        html:'🚌',
        className:'bus-icon',
        iconSize:[26,26],
        iconAnchor:[13,13],
        popupAnchor:[0,-12]
      });

      const cluster = L.markerClusterGroup({
        pane:'markersPane',
        disableClusteringAtZoom:16,
        spiderfyOnMaxZoom:true,
        showCoverageOnHover:false
      });

      const pick = p=>{
        const ks=['名称','停留所名','バス停名','name','Name','停名','停留所'];
        for(const k of ks){
          if(p&&p[k]) return z2h(p[k]);
        }
        for(const [,v] of Object.entries(p??{})){
          if(typeof v==='string'&&v.trim()) return z2h(v);
        }
        return '';
      };

      const buses = L.geoJSON(data,{
        pane:'markersPane',
        pointToLayer:(f,latlng)=>{
          const p=f.properties??{};
          p._bus_name = pick(p);
          const m=L.marker(latlng,{icon:ic});
          setTitle(m,p._bus_name);
          return m;
        },
        onEachFeature:(f,l)=>{
          const p=f.properties??{};
          const n=p._bus_name ?? '';
          const skip=new Set(['名称','停留所名','バス停名','name','Name','停名','停留所']);
          const rest=Object.entries(p)
            .filter(([k])=>!skip.has(k) && k!=='_bus_name')
            .map(([k,v])=>`<b>${k}:</b> ${v}`)
            .join('<br>');

          l.bindPopup(
            `<b>バス停（令和4年）</b>`+
            `${n?`<br><b>名称:</b> ${n}`:''}`+
            `${rest?`<br>${rest}`:''}`
          );
        }
      });

      cluster.addLayer(buses);
      map.addLayer(cluster);
      ctl.addOverlay(cluster,'バス停（令和4年）');

      const s5 = new L.Control.Search({
        layer: buses,
        propertyName:'_bus_name',
        textPlaceholder:'バス停名',
        marker:false,
        zoom:18,
        collapsed:false
      }).addTo(map);

      decorateSearch(s5,'🚌 バス停','#6a1b9a');

      s5.on('search:locationfound', e=>{
        if (e.latlng) map.setView(e.latlng, Math.max(map.getZoom(),18));
        if (e.layer.openPopup) e.layer.openPopup();
      });
    })
    .catch(err=>console.error(err));

  // ===== 地価調査（2025年・石川／初期ON） =====
  fetch('./石川地価2025.geojson?_=2025',{cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error(`石川地価2025.geojson: HTTP ${r.status}`);
      return r.json();
    })
    .then(data=>{
      const icon = L.icon({
        iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-orange.png',
        shadowUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-shadow.png',
        iconSize:[25,41],
        iconAnchor:[12,41],
        popupAnchor:[0,-35]
      });

      const land = L.geoJSON(data,{
        pane:'markersPane',
        pointToLayer:(f,latlng)=>{
          const p=f.properties??{};
          const site = pickKey(p,[
            '基準地の地名','標準地番号','標準地番号（コード）',
            '地点番号','番号',/標準地/,/基準地/
          ]);
          const where = pickKey(p,[
            '所在並びに地番','所在地並びに地番','所在地',
            '住居表示','地番','地点名','地区名',/所在/
          ]);
          p._land_label = z2h([site,where].filter(Boolean).join(' ')) || '地価調査地点';

          const m=L.marker(latlng,{icon});
          setTitle(m,p._land_label);
          return m;
        },
        onEachFeature:(f,l)=>{
          const p=f.properties??{};
          const site = pickKey(p,[
            '基準地の地名','標準地番号','標準地番号（コード）',
            '地点番号','番号',/標準地/,/基準地/
          ]);
          const where = pickKey(p,[
            '所在並びに地番','所在地並びに地番','所在地',
            '住居表示','地番','地点名','地区名',/所在/
          ]);
          const use = pickKey(p,[
            '都市計画の用途地域','用途','用途区分','区分','用途地域',/用途/
          ]);
          const price = fmtYen(pickKey(p,[
            '円/ｍ2','円/m2','円/㎡','価格','価格（円/㎡）',
            '価格_円m2','単価','price',/円.?m2/
          ]));
          const yoy = fmtPct(pickKey(p,[
            '対前年変動率%','対前年変動率','対前年変動率（％）',
            '変動率','前年比','前年比％','yoy',/対前年.*変動率/,/前年比/
          ]));
          const note = pickKey(p,['備考','注記','メモ']);

          let html =
            `<b>地価調査（2025年・石川）</b><br>`+
            `<b>基準地:</b> ${site||'-'}<br>`+
            `<b>所在地:</b> ${where||'-'}<br>`+
            `<b>用途地域:</b> ${use||'-'}<br>`+
            `<b>価格:</b> ${price}<br>`+
            `<b>対前年変動率:</b> ${yoy}`;

          if(note) html += `<br><b>備考:</b> ${note}`;
          l.bindPopup(html);
        }
      });

      const cluster = L.markerClusterGroup({
        pane:'markersPane',
        disableClusteringAtZoom:16,
        spiderfyOnMaxZoom:true,
        showCoverageOnHover:false
      });

      cluster.addLayer(land);
      map.addLayer(cluster);
      ctl.addOverlay(cluster,'地価調査（2025年・石川）');
    })
    .catch(err=>console.error('地価2025の読込に失敗:',err));

  // ===== くま目撃情報（2025年／初期ON） =====
  fetch('./R7石川熊.geojson?_=2025',{cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error(`R7石川熊.geojson: HTTP ${r.status}`);
      return r.json();
    })
    .then(data=>{
      const bearIcon = L.divIcon({
        html:'🐻',
        className:'bus-icon',
        iconSize:[26,26],
        iconAnchor:[13,13],
        popupAnchor:[0,-12]
      });

      const parseDescriptionToTable = description => {
        const parts = (description??'')
          .toString()
          .split(/<br\s*\/?>/i)
          .map(s=>s.trim())
          .filter(Boolean);

        const rows = parts.map(line=>{
          const idx = line.search(/[:：]/);
          if(idx>-1){
            const key=line.slice(0,idx).trim();
            const value=line.slice(idx+1).trim();
            return `<tr><th style="text-align:left;padding-right:6px;white-space:nowrap;">${key}</th><td>${value}</td></tr>`;
          }
          return `<tr><td colspan="2">${line}</td></tr>`;
        }).join('');

        return `<b>くま目撃情報（2025年）</b>`+
          `<div style="max-height:260px;overflow:auto;"><table>${rows}</table></div>`;
      };

      const bears = L.geoJSON(data,{
        pane:'markersPane',
        pointToLayer:(f,latlng)=>{
          const p=f.properties??{};
          const title = p.Name || p.name || p['市町名'] || p['場所'] || p['出没日'] || 'くま目撃情報';
          return L.marker(latlng,{icon:bearIcon,title:z2h(title)});
        },
        onEachFeature:(f,l)=>{
          const p=f.properties??{};
          l.bindPopup(parseDescriptionToTable(p.description??p.DESCRIPTION??''));
        }
      });

      const cluster = L.markerClusterGroup({
        pane:'markersPane',
        disableClusteringAtZoom:17,
        spiderfyOnMaxZoom:true,
        showCoverageOnHover:false
      });

      cluster.addLayer(bears);
      map.addLayer(cluster);
      ctl.addOverlay(cluster,'くま目撃情報（2025年）');
    })
    .catch(err=>console.error('くま目撃情報2025の読込に失敗:',err));

  // ===== 土砂災害（番号も名称も検索／「0344」OK）※最後に追加＝一番下 =====
  fetch('./dosya.geojson',{cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error(`dosya.geojson: HTTP ${r.status}`);
      return r.json();
    })
    .then(data=>{
      const col=v=>
        (v==1||v==='1') ? '#ffff00' :
        (v==2||v==='2') ? '#ff0000' :
        '#888';

      const nm=v=>
        (v==1||v==='1') ? 'イエローゾーン' :
        (v==2||v==='2') ? 'レッドゾーン' :
        'その他';

      const danger = L.geoJSON(data,{
        pane:'zonesPane',
        style:f=>({
          color:col(f.properties.A33_002),
          weight:2,
          opacity:.9,
          fillOpacity:.25
        }),
        onEachFeature:(f,l)=>{
          const p=f.properties??{};
          const num = (p.A33_004??'')
            .toString()
            .split(/[-－―‐]/)[0]
            .replace(/\D/g,'');

          const name = (p.A33_005??'').toString();

          setTitle(l, `${num} ${name}`.trim());

          l.bindPopup(
            `<b>${nm(p.A33_002)}</b><br>`+
            `<b>箇所番号:</b> ${p.A33_004??'-'}<br>`+
            `<b>箇所名:</b> ${p.A33_005??'-'}`+
            `${p.A33_009?`<br><b>市町村:</b> ${p.A33_009}`:''}`
          );
        }
      }).addTo(map);

      ctl.addOverlay(danger,'土砂災害警戒区域');

      const s2 = new L.Control.Search({
        layer: danger,
        propertyName:'title',
        textPlaceholder:'箇所番号 / 箇所名',
        marker:false,
        zoom:16,
        collapsed:false
      }).addTo(map);

      decorateSearch(s2,'⚠️ 土砂災害','#e53935');

      // 念のため「最下段」に固定
      const corner = map._controlCorners['topleft'];
      corner.appendChild(s2._container);

      s2.on('search:locationfound', e=>{
        if (e.layer.getBounds){
          map.fitBounds(e.layer.getBounds(),{
            maxZoom:18,
            padding:[24,24]
          });
        }
        if (e.layer.openPopup) e.layer.openPopup();
      });
    })
    .catch(err=>console.error(err));

  // 凡例
  const legend=L.control({position:'bottomright'});

  legend.onAdd=()=>{
    const d=L.DomUtil.create('div','legend');
    d.innerHTML =
      '<div class="legend-title">凡例</div>'+
      '<i style="background:#ffff00;"></i> イエローゾーン<br>'+
      '<i style="background:#ff0000;"></i> レッドゾーン<br>'+
      '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png" style="height:18px;vertical-align:middle;margin-right:6px;"> 指定避難場所<br>'+
      '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-blue.png" style="height:18px;vertical-align:middle;margin-right:6px;"> ため池<br>'+
      '<span style="font-size:18px;vertical-align:middle;margin-right:6px;">🚌</span> バス停（令和4年）<br>'+
      '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-orange.png" style="height:18px;vertical-align:middle;margin-right:6px;"> 地価調査（2025年）<br>'+
      '<span style="font-size:18px;vertical-align:middle;margin-right:6px;">🐻</span> くま目撃情報（2025年）'+
      '<hr>'+
      '<div class="legend-title">洪水浸水想定区域（想定最大規模）</div>'+
      '<i style="background:#d400ff;"></i> 20m以上<br>'+
      '<i style="background:#ff66cc;"></i> 10m～20m<br>'+
      '<i style="background:#ff9966;"></i> 5m～10m<br>'+
      '<i style="background:#ffcc66;"></i> 3m～5m<br>'+
      '<i style="background:#ffe699;"></i> 0.5m～3m<br>'+
      '<i style="background:#ffffcc;"></i> 0.5m未満';
    return d;
  };

  legend.addTo(map);

  // 現在地
  if (L.control.locate){
    L.control.locate({
      position:'topleft',
      flyTo:true,
      strings:{title:'現在地を表示'},
      locateOptions:{enableHighAccuracy:true}
    }).addTo(map);
  }
}
</script>
</body>
</html>
