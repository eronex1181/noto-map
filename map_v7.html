<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>石川県・能登 防災Webマップ</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
html,body,#map{height:100%;margin:0}
#map{background:#f3f3f3}
.leaflet-control-layers{max-height:76vh;overflow:auto}
.search-tag{
 display:inline-block;margin:6px;padding:2px 8px;border-radius:999px;
 font-size:12px;color:#fff;background:#607d8b;font-weight:bold
}
.map-symbol-wrapper{background:transparent;border:none}
.map-symbol{
 width:30px;height:30px;display:flex;align-items:center;justify-content:center;
 border-radius:50%;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.55);
 font-weight:bold
}
.shelter-symbol{background:#2e7d32;color:#fff}
.pond-symbol{background:#1976d2;color:#fff}
.land-symbol{background:#ef6c00;color:#fff}
.bus-icon,.bear-icon{font-size:22px;text-align:center}
.legend{
 background:rgba(255,255,255,.96);padding:7px 10px;line-height:19px;
 box-shadow:0 1px 7px rgba(0,0,0,.3);font-size:12px;max-height:46vh;overflow:auto
}
.legend i{display:inline-block;width:18px;height:12px;margin-right:6px;vertical-align:-1px}
.legend-title{font-weight:bold;margin:2px 0 4px}
</style>
</head>
<body>
<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
const map=L.map('map',{preferCanvas:true,maxZoom:19}).setView([37.20,136.90],10);

// ---------- Panes ----------
map.createPane('geologyPane');
map.getPane('geologyPane').style.zIndex=405;
map.getPane('geologyPane').style.pointerEvents='none';

map.createPane('waterPane');
map.getPane('waterPane').style.zIndex=410;
map.getPane('waterPane').style.pointerEvents='none';

map.createPane('boundaryPane');
map.getPane('boundaryPane').style.zIndex=421;

map.createPane('zonesPane');
map.getPane('zonesPane').style.zIndex=430;

// 国土基本図1/2500図郭
map.createPane('zukakuPane');
map.getPane('zukakuPane').style.zIndex=447;

map.createPane('markersPane');
map.getPane('markersPane').style.zIndex=450;

// ---------- Backgrounds ----------
const notoCS=L.tileLayer(
 'https://rinya.geospatial.jp/tile/csmaptile_noto/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:18,maxZoom:19,attribution:'© 林野庁'}
);

const gsiPhoto=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
 {minZoom:2,maxNativeZoom:18,maxZoom:19,attribution:'© 国土地理院'}
);

function kjMap(folder){
 return L.tileLayer(
   `https://ktgis.net/kjmapw/kjtilemap/kanazawa/${folder}/{z}/{x}/{-y}.png`,
   {minZoom:8,maxNativeZoom:16,maxZoom:19,attribution:'今昔マップ on the web（谷 謙二）'}
 );
}
const kj1909=kjMap('2man');
const kj1930=kjMap('00');
const kj1968=kjMap('01');
const kj1981=kjMap('02');
const kj1994=kjMap('03');

const gsiPale=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:18,maxZoom:19,attribution:'© 国土地理院'}
);

const gsiStd=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:18,maxZoom:19,attribution:'© 国土地理院'}
);

// ---------- GSJ geology ----------
const geology200k=L.tileLayer.wms(
 'https://ows.gsj.jp/ows/seamlessv2',
 {
   layers:'seamlessV2_poly,seamlessV2_line,seamlessV2_poly_label',
   format:'image/png',
   transparent:true,
   version:'1.1.1',
   pane:'geologyPane',
   opacity:.68,
   attribution:'20万分の1日本シームレス地質図V2 © 産総研GSJ'
 }
);

// ---------- Six water-hazard layers ----------
function waterTile(url,opacity=.70){
 return L.tileLayer(url,{
   minZoom:2,maxNativeZoom:17,maxZoom:19,
   opacity,pane:'waterPane',
   attribution:'ハザードマップポータルサイト © 国土地理院'
 });
}

const floodL2=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png'
);
const houseFlood=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_hanran_data/{z}/{x}/{y}.png',.75
);
const houseErosion=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_kagan_data/{z}/{x}/{y}.png',.75
);
const inlandFlood=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png'
);
const stormSurge=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png'
);
const tsunami=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png'
);

const baseMaps={
 '国土地理院（淡色）':gsiPale,
 '国土地理院（標準）':gsiStd,
 '国土地理院（航空写真）':gsiPhoto,
 '今昔マップ 金沢・富山（1909～1910年）':kj1909,
 '今昔マップ 金沢・富山（1930年）':kj1930,
 '今昔マップ 金沢・富山（1968～1969年）':kj1968,
 '今昔マップ 金沢・富山（1981～1985年）':kj1981,
 '今昔マップ 金沢・富山（1994～2001年）':kj1994
};

const overlays={
 '地質図 1/20万（シームレスV2・GSJ）':geology200k,
 '能登半島CS立体図':notoCS,
 '① 洪水浸水想定区域（想定最大規模）':floodL2,
 '② 家屋倒壊等氾濫想定区域（氾濫流）':houseFlood,
 '③ 家屋倒壊等氾濫想定区域（河岸侵食）':houseErosion,
 '④ 内水（雨水出水）浸水想定区域':inlandFlood,
 '⑤ 高潮浸水想定区域':stormSurge,
 '⑥ 津波浸水想定':tsunami
};

// 千葉県版と同じく、淡色地図を初期ベースマップにする。
gsiPale.addTo(map);

// レイヤー一覧は最初から展開。
const ctl=L.control.layers(baseMaps,overlays,{collapsed:false}).addTo(map);

L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

// =====================================================
// 国土基本図 1/2500 図郭（石川県）
// GeoJSONはWGS84（EPSG:4326）へ変換済み。
// 初期OFF。ONでグレー枠表示、クリック／タップで図郭番号。
// =====================================================
let zukaku2500Layer=null;

fetchJson('ishikawa_kodokihonzu_2500.json')
.then(data=>{
  zukaku2500Layer=L.geoJSON(data,{
    pane:'zukakuPane',
    style:{
      color:'#777',
      weight:1,
      opacity:.90,
      fillColor:'#ffffff',
      fillOpacity:.001
    },
    onEachFeature:(f,l)=>{
      const p=f.properties||{};
      const code=p.sheet_code||p.SHEET_CODE||p.code||p.CODE||'不明';

      l.bindPopup(
        `<div style="font-size:13px;line-height:1.6;min-width:130px">`+
        `<b>国土基本図 1/2500</b><br>`+
        `図郭番号：<b>${esc(code)}</b>`+
        `</div>`,
        {maxWidth:260}
      );

      l.bindTooltip(`図郭番号：${esc(code)}`,{
        sticky:true,direction:'top',opacity:.95
      });

      l.on({
        mouseover:e=>{
          e.target.setStyle({color:'#555',weight:2,opacity:1,fillOpacity:.015});
          if(e.target.bringToFront)e.target.bringToFront();
        },
        mouseout:e=>{
          if(zukaku2500Layer)zukaku2500Layer.resetStyle(e.target);
        }
      });
    }
  });

  ctl.addOverlay(zukaku2500Layer,'国土基本図 1/2500 図郭');
  console.log(`石川県 国土基本図1/2500図郭：${data.features?.length||0}図郭を読込完了`);
})
.catch(err=>console.error('石川県 国土基本図1/2500図郭の読み込みに失敗:',err));

// ---------- Helpers ----------
function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function mapLinks(ll){
 if(!ll)return '';
 const lat=Number(ll.lat).toFixed(7), lng=Number(ll.lng).toFixed(7);
 return `<div style="margin-top:8px;padding-top:7px;border-top:1px solid #ddd">
 <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank" rel="noopener"
 style="display:inline-block;margin-right:6px;padding:5px 9px;border-radius:4px;background:#1976d2;color:#fff;text-decoration:none;font-weight:bold">📍 Googleマップ</a>
 <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}" target="_blank" rel="noopener"
 style="display:inline-block;padding:5px 9px;border-radius:4px;background:#2e7d32;color:#fff;text-decoration:none;font-weight:bold">👁 ストリートビュー</a>
 </div>`;
}

function propsHtml(title,p,ll){
 const rows=Object.entries(p||{})
  .filter(([k,v])=>!k.startsWith('_') && v!==null && v!==undefined && String(v).trim()!=='')
  .map(([k,v])=>`<tr><th style="text-align:left;white-space:nowrap;padding-right:7px">${esc(k)}</th><td>${esc(v)}</td></tr>`)
  .join('');
 return `<b>${esc(title)}</b><div style="max-height:230px;overflow:auto"><table>${rows}</table></div>${mapLinks(ll)}`;
}

function addSearch(layer,property,label,color,zoom=17){
 if(!L.Control.Search)return;
 const s=new L.Control.Search({
   layer,propertyName:property,textPlaceholder:label,
   marker:false,zoom,collapsed:window.innerWidth<700
 }).addTo(map);

 // Leaflet Search は検索対象レイヤーを地図へ直接追加することがある。
 // 検索データとしては保持しつつ、レイヤー一覧でOFFのものは初期表示しない。
 if(map.hasLayer(layer)) map.removeLayer(layer);
 setTimeout(()=>{
   if(map.hasLayer(layer)) map.removeLayer(layer);
 },0);

 const el=s._container||s.getContainer();
 const tag=document.createElement('span');
 tag.className='search-tag';
 tag.style.background=color;
 tag.textContent=label;
 (el.querySelector('form')||el).insertBefore(tag,el.firstChild);
 s.on('search:locationfound',e=>{
   if(e.layer?.getBounds) map.fitBounds(e.layer.getBounds(),{maxZoom:zoom,padding:[20,20]});
   else if(e.latlng) map.setView(e.latlng,zoom);
   if(e.layer?.openPopup)e.layer.openPopup();
 });
}

function clusterLayer(geo,disableZoom=16){
 const cluster=L.markerClusterGroup({
   disableClusteringAtZoom:disableZoom,
   spiderfyOnMaxZoom:true,
   showCoverageOnHover:false
 });
 cluster.addLayer(geo);
 return cluster;
}

async function fetchJson(file){
 const r=await fetch('./'+encodeURIComponent(file),{cache:'no-store'});
 if(!r.ok)throw new Error(file+' HTTP '+r.status);
 return r.json();
}

// ---------- Oaza boundary ----------
fetchJson('kyoukai.geojson').then(data=>{
 const layer=L.geoJSON(data,{
   pane:'boundaryPane',
   style:{color:'#2e7d32',weight:1.3,dashArray:'4,4',fillOpacity:0},
   onEachFeature:(f,l)=>{
     const p=f.properties||{};
     p._search=(p['大字']||'')+' '+(p['市町村']||'');
     const c=l.getBounds?l.getBounds().getCenter():null;
     l.bindPopup(propsHtml('大字境界',p,c));
   }
 });
 ctl.addOverlay(layer,'大字境界');
 addSearch(layer,'_search','🗺 大字','#2e7d32',15);
}).catch(console.error);

// ---------- Shelter ----------
fetchJson('17000_1.geojson').then(data=>{
 const icon=L.divIcon({
   html:'<div class="map-symbol shelter-symbol">避</div>',
   className:'map-symbol-wrapper',iconSize:[30,30],iconAnchor:[15,15]
 });
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>{
     const p=f.properties||{};
     p._search=p['施設・場所名']||p['名称']||'';
     return L.marker(ll,{icon,title:p._search});
   },
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('指定避難場所',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo),'指定避難場所');
 addSearch(geo,'_search','🏫 避難所','#388e3c',17);
}).catch(console.error);

// ---------- Ponds ----------
fetchJson('ため池.geojson').then(data=>{
 const icon=L.divIcon({
   html:'<div class="map-symbol pond-symbol">💧</div>',
   className:'map-symbol-wrapper',iconSize:[30,30],iconAnchor:[15,15]
 });
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>{
     const p=f.properties||{};
     p._search=p.name||p['名称']||p.Name||'';
     return L.marker(ll,{icon,title:p._search});
   },
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('ため池',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo),'ため池');
 addSearch(geo,'_search','💧 ため池','#1976d2',18);
}).catch(console.error);

// ---------- Bus stops ----------
fetchJson('P11-22_17.geojson').then(data=>{
 const icon=L.divIcon({html:'🚌',className:'bus-icon',iconSize:[28,28],iconAnchor:[14,14]});
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>{
     const p=f.properties||{};
     const keys=['名称','停留所名','バス停名','name','Name'];
     p._search=keys.map(k=>p[k]).find(Boolean)||'';
     return L.marker(ll,{icon,title:p._search});
   },
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('バス停（令和4年）',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo),'バス停（令和4年）');
 addSearch(geo,'_search','🚌 バス停','#6a1b9a',18);
}).catch(console.error);

// ---------- Land price ----------
fetchJson('石川地価2025.geojson').then(data=>{
 const icon=L.divIcon({
   html:'<div class="map-symbol land-symbol">¥</div>',
   className:'map-symbol-wrapper',iconSize:[30,30],iconAnchor:[15,15]
 });
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>L.marker(ll,{icon}),
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('地価調査（2025年・石川）',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo),'地価調査（2025年・石川）');
}).catch(console.error);

// ---------- Bear sightings ----------
fetchJson('R7石川熊.geojson').then(data=>{
 const icon=L.divIcon({html:'🐻',className:'bear-icon',iconSize:[28,28],iconAnchor:[14,14]});
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>L.marker(ll,{icon}),
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('くま目撃情報（2025年）',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo,17),'くま目撃情報（2025年）');
}).catch(console.error);

// ---------- Large-scale fill ----------
fetchJson('A54-23_17.geojson').then(data=>{
 const layer=L.geoJSON(data,{
   pane:'zonesPane',
   style:f=>{
     const v=String(f.properties?.A54_001??'');
     const color=v==='1'?'#43a047':v==='2'?'#fb8c00':v==='9'?'#8e24aa':'#757575';
     return {color,weight:2,fillColor:color,fillOpacity:.30};
   },
   onEachFeature:(f,l)=>{
     const c=l.getBounds?l.getBounds().getCenter():null;
     l.bindPopup(propsHtml('大規模盛土造成地（2023年）',f.properties,c));
   }
 });
 ctl.addOverlay(layer,'大規模盛土造成地（2023年）');
}).catch(console.error);

// ---------- Landslide hazard zones ----------
fetchJson('dosya.geojson').then(data=>{
 const zoneName=v=>String(v)==='1'?'土砂災害警戒区域（イエローゾーン）':
                         String(v)==='2'?'土砂災害特別警戒区域（レッドゾーン）':'土砂災害区域';
 const danger=L.geoJSON(data,{
   pane:'zonesPane',
   style:f=>{
     const v=String(f.properties?.A33_002??'');
     const c=v==='1'?'#ffff00':v==='2'?'#ff0000':'#888';
     return {color:c,weight:1.8,opacity:.95,fillColor:c,fillOpacity:.28};
   },
   onEachFeature:(f,l)=>{
     const p=f.properties||{};
     p._search=`${p.A33_004||''} ${p.A33_005||''} ${p.A33_009||''}`.trim();
     const c=l.getBounds?l.getBounds().getCenter():null;
     l.bindPopup(
       `<b>${zoneName(p.A33_002)}</b><br>`+
       `<b>箇所番号:</b> ${esc(p.A33_004||'-')}<br>`+
       `<b>箇所名:</b> ${esc(p.A33_005||'-')}`+
       `${p.A33_009?`<br><b>市町村:</b> ${esc(p.A33_009)}`:''}`+
       mapLinks(c)
     );
   }
 }).addTo(map);
 ctl.addOverlay(danger,'土砂災害警戒区域・特別警戒区域');
 addSearch(danger,'_search','⚠️ 土砂災害','#e53935',16);
}).catch(console.error);

// ---------- Locate ----------
if(L.control.locate){
 L.control.locate({
   position:'topleft',
   flyTo:true,
   keepCurrentZoomLevel:false,
   strings:{title:'現在地を表示'},
   locateOptions:{enableHighAccuracy:true}
 }).addTo(map);
}

// ---------- Legend ----------
const legend=L.control({position:'bottomright'});
legend.onAdd=()=>{
 const d=L.DomUtil.create('div','legend');
 d.innerHTML=
  '<div class="legend-title">土砂災害</div>'+
  '<i style="background:#ffff00"></i>警戒区域（イエロー）<br>'+
  '<i style="background:#ff0000"></i>特別警戒区域（レッド）<br>'+
  '<hr style="border:0;border-top:1px solid #ccc">'+
  '<div class="legend-title">水害レイヤー</div>'+
  '① 洪水浸水想定区域<br>'+
  '② 家屋倒壊（氾濫流）<br>'+
  '③ 家屋倒壊（河岸侵食）<br>'+
  '④ 内水浸水想定区域<br>'+
  '⑤ 高潮浸水想定区域<br>'+
  '⑥ 津波浸水想定';
 return d;
};
legend.addTo(map);
</script>
</body>
</html>
