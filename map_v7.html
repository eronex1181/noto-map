<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>石川県・能登 防災Webマップ</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
html,body,#map{height:100%;margin:0}
#map{background:#f3f3f3}
.leaflet-control-layers{max-height:76vh;overflow:auto}
.search-tag{
 display:inline-block;margin:6px;padding:2px 8px;border-radius:999px;
 font-size:12px;color:#fff;background:#607d8b;font-weight:bold
}
.map-symbol-wrapper{background:transparent;border:none}
.map-symbol{
 width:30px;height:30px;display:flex;align-items:center;justify-content:center;
 border-radius:50%;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.55);
 font-weight:bold
}
.shelter-symbol{background:#2e7d32;color:#fff}
.pond-symbol{background:#1976d2;color:#fff}
.land-symbol{background:#ef6c00;color:#fff}
.bus-icon,.bear-icon{font-size:22px;text-align:center}
.legend{
 background:rgba(255,255,255,.96);padding:7px 10px;line-height:19px;
 box-shadow:0 1px 7px rgba(0,0,0,.3);font-size:12px;max-height:46vh;overflow:auto
}
.legend i{display:inline-block;width:18px;height:12px;margin-right:6px;vertical-align:-1px}
.legend-title{font-weight:bold;margin:2px 0 4px}

#pointinfo{
 position:absolute;
 z-index:1001;
 left:10px;
 bottom:58px;
 max-width:min(420px,calc(100vw - 24px));
 background:rgba(255,255,255,.96);
 border:1px solid #bbb;
 box-shadow:0 1px 5px rgba(0,0,0,.25);
 border-radius:6px;
 padding:8px 10px;
 font-size:12px;
 line-height:1.55;
 display:none;
 -webkit-user-select:text;
 user-select:text;
 cursor:text;
}
#pointinfo .point-title{font-weight:700;margin-bottom:2px}
#pointinfo .point-address{word-break:break-word}
#pointinfo .point-coord,
#pointinfo .plane-coord{font-family:monospace;color:#333}
#pointinfo .plane-coord{margin-top:4px}
#pointinfo .point-note{font-size:10px;color:#777;margin-top:3px}

</style>
</head>
<body>
<div id="map"></div>
<div id="pointinfo"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://maps.gsi.go.jp/js/muni.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>

<script>
const map=L.map('map',{preferCanvas:true,maxZoom:28}).setView([37.20,136.90],10);

// ---------- Panes ----------
map.createPane('geologyPane');
map.getPane('geologyPane').style.zIndex=405;
map.getPane('geologyPane').style.pointerEvents='none';

map.createPane('waterPane');
map.getPane('waterPane').style.zIndex=410;
map.getPane('waterPane').style.pointerEvents='none';

map.createPane('boundaryPane');
map.getPane('boundaryPane').style.zIndex=421;

map.createPane('zonesPane');
map.getPane('zonesPane').style.zIndex=430;

// 国土基本図1/2500図郭
map.createPane('zukakuPane');
map.getPane('zukakuPane').style.zIndex=447;

map.createPane('markersPane');
map.getPane('markersPane').style.zIndex=450;

// ---------- Backgrounds ----------
const notoCS=L.tileLayer(
 'https://rinya.geospatial.jp/tile/csmaptile_noto/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:18,maxZoom:28,attribution:'© 林野庁'}
);

const gsiPhoto=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
 {minZoom:2,maxNativeZoom:18,maxZoom:28,attribution:'© 国土地理院'}
);

function kjMap(folder){
 return L.tileLayer(
   `https://ktgis.net/kjmapw/kjtilemap/kanazawa/${folder}/{z}/{x}/{-y}.png`,
   {minZoom:8,maxNativeZoom:16,maxZoom:28,attribution:'今昔マップ on the web（谷 謙二）'}
 );
}
const kj1909=kjMap('2man');
const kj1930=kjMap('00');
const kj1968=kjMap('01');
const kj1981=kjMap('02');
const kj1994=kjMap('03');

const gsiPale=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:18,maxZoom:28,attribution:'© 国土地理院'}
);

const gsiStd=L.tileLayer(
 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
 {minZoom:2,maxNativeZoom:18,maxZoom:28,attribution:'© 国土地理院'}
);

// ---------- GSJ geology ----------
const geology200k=L.tileLayer.wms(
 'https://ows.gsj.jp/ows/seamlessv2',
 {
   layers:'seamlessV2_poly,seamlessV2_line,seamlessV2_poly_label',
   format:'image/png',
   transparent:true,
   version:'1.1.1',
   pane:'geologyPane',
   opacity:.68,
   attribution:'20万分の1日本シームレス地質図V2 © 産総研GSJ'
 }
);

// ---------- Six water-hazard layers ----------
function waterTile(url,opacity=.70){
 return L.tileLayer(url,{
   minZoom:2,maxNativeZoom:17,maxZoom:28,
   opacity,pane:'waterPane',
   attribution:'ハザードマップポータルサイト © 国土地理院'
 });
}

const floodL2=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png'
);
const houseFlood=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_hanran_data/{z}/{x}/{y}.png',.75
);
const houseErosion=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/01_flood_l2_kaokutoukai_kagan_data/{z}/{x}/{y}.png',.75
);
const inlandFlood=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/02_naisui_data/{z}/{x}/{y}.png'
);
const stormSurge=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/03_hightide_l2_shinsuishin_data/{z}/{x}/{y}.png'
);
const tsunami=waterTile(
 'https://disaportaldata.gsi.go.jp/raster/04_tsunami_newlegend_data/{z}/{x}/{y}.png'
);

// 背景地図もチェックボックス式にする。
// 全部OFFにでき、1枚ONにすると他の背景地図は自動OFF。
const backgroundMaps={
 '国土地理院（淡色）':gsiPale,
 '国土地理院（標準）':gsiStd,
 '国土地理院（航空写真）':gsiPhoto,
 '今昔マップ 金沢・富山（1909～1910年）':kj1909,
 '今昔マップ 金沢・富山（1930年）':kj1930,
 '今昔マップ 金沢・富山（1968～1969年）':kj1968,
 '今昔マップ 金沢・富山（1981～1985年）':kj1981,
 '今昔マップ 金沢・富山（1994～2001年）':kj1994
};

const overlays={
 ...backgroundMaps,
 '地質図 1/20万（シームレスV2・GSJ）':geology200k,
 '能登半島CS立体図':notoCS,
 '① 洪水浸水想定区域（想定最大規模）':floodL2,
 '② 家屋倒壊等氾濫想定区域（氾濫流）':houseFlood,
 '③ 家屋倒壊等氾濫想定区域（河岸侵食）':houseErosion,
 '④ 内水（雨水出水）浸水想定区域':inlandFlood,
 '⑤ 高潮浸水想定区域':stormSurge,
 '⑥ 津波浸水想定':tsunami
};

// 初期状態は淡色地図を表示。
// このチェックを外せば、背景地図なしでも表示できる。
gsiPale.addTo(map);

// baseMapsを空にして、背景地図もチェックボックス表示にする。
const ctl=L.control.layers({},overlays,{collapsed:false}).addTo(map);

// 背景地図は同時に1枚だけ。ただし全部OFFは可。
const backgroundLayerSet=new Set(Object.values(backgroundMaps));
let changingBackground=false;
map.on('overlayadd',e=>{
 if(changingBackground || !backgroundLayerSet.has(e.layer))return;
 changingBackground=true;
 backgroundLayerSet.forEach(layer=>{
   if(layer!==e.layer && map.hasLayer(layer))map.removeLayer(layer);
 });
 changingBackground=false;
});

L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

// =====================================================
// 国土基本図 1/2500 図郭（石川県）
// GeoJSONはWGS84（EPSG:4326）へ変換済み。
// 初期OFF。ONでグレー枠表示、クリック／タップで図郭番号。
// =====================================================
let zukaku2500Layer=null;

fetchJson('ishikawa_kodokihonzu_2500.json')
.then(data=>{
  zukaku2500Layer=L.geoJSON(data,{
    pane:'zukakuPane',
    style:{
      color:'#777',
      weight:1,
      opacity:.90,
      fillColor:'#ffffff',
      fillOpacity:.001
    },
    onEachFeature:(f,l)=>{
      const p=f.properties||{};
      const code=p.sheet_code||p.SHEET_CODE||p.code||p.CODE||'不明';

      l.bindPopup(
        `<div style="font-size:13px;line-height:1.6;min-width:130px">`+
        `<b>国土基本図 1/2500</b><br>`+
        `図郭番号：<b>${esc(code)}</b>`+
        `</div>`,
        {maxWidth:260}
      );

      l.bindTooltip(`図郭番号：${esc(code)}`,{
        sticky:true,direction:'top',opacity:.95
      });

      l.on({
        mouseover:e=>{
          e.target.setStyle({color:'#555',weight:2,opacity:1,fillOpacity:.015});
          if(e.target.bringToFront)e.target.bringToFront();
        },
        mouseout:e=>{
          if(zukaku2500Layer)zukaku2500Layer.resetStyle(e.target);
        }
      });
    }
  });

  ctl.addOverlay(zukaku2500Layer,'国土基本図 1/2500 図郭');
  console.log(`石川県 国土基本図1/2500図郭：${data.features?.length||0}図郭を読込完了`);
})
.catch(err=>console.error('石川県 国土基本図1/2500図郭の読み込みに失敗:',err));

// ---------- Helpers ----------
function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function mapLinks(ll){
 if(!ll)return '';
 const lat=Number(ll.lat).toFixed(7), lng=Number(ll.lng).toFixed(7);
 return `<div style="margin-top:8px;padding-top:7px;border-top:1px solid #ddd">
 <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank" rel="noopener"
 style="display:inline-block;margin-right:6px;padding:5px 9px;border-radius:4px;background:#1976d2;color:#fff;text-decoration:none;font-weight:bold">📍 Googleマップ</a>
 <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}" target="_blank" rel="noopener"
 style="display:inline-block;padding:5px 9px;border-radius:4px;background:#2e7d32;color:#fff;text-decoration:none;font-weight:bold">👁 ストリートビュー</a>
 </div>`;
}

function propsHtml(title,p,ll){
 const rows=Object.entries(p||{})
  .filter(([k,v])=>!k.startsWith('_') && v!==null && v!==undefined && String(v).trim()!=='')
  .map(([k,v])=>`<tr><th style="text-align:left;white-space:nowrap;padding-right:7px">${esc(k)}</th><td>${esc(v)}</td></tr>`)
  .join('');
 return `<b>${esc(title)}</b><div style="max-height:230px;overflow:auto"><table>${rows}</table></div>${mapLinks(ll)}`;
}

function addSearch(layer,property,label,color,zoom=17){
 if(!L.Control.Search)return;
 const s=new L.Control.Search({
   layer,propertyName:property,textPlaceholder:label,
   marker:false,zoom,collapsed:window.innerWidth<700
 }).addTo(map);

 // Leaflet Search は検索対象レイヤーを地図へ直接追加することがある。
 // 検索データとしては保持しつつ、レイヤー一覧でOFFのものは初期表示しない。
 if(map.hasLayer(layer)) map.removeLayer(layer);
 setTimeout(()=>{
   if(map.hasLayer(layer)) map.removeLayer(layer);
 },0);

 const el=s._container||s.getContainer();
 const tag=document.createElement('span');
 tag.className='search-tag';
 tag.style.background=color;
 tag.textContent=label;
 (el.querySelector('form')||el).insertBefore(tag,el.firstChild);
 s.on('search:locationfound',e=>{
   if(e.layer?.getBounds) map.fitBounds(e.layer.getBounds(),{maxZoom:zoom,padding:[20,20]});
   else if(e.latlng) map.setView(e.latlng,zoom);
   if(e.layer?.openPopup)e.layer.openPopup();
 });
}

function clusterLayer(geo,disableZoom=16){
 const cluster=L.markerClusterGroup({
   disableClusteringAtZoom:disableZoom,
   spiderfyOnMaxZoom:true,
   showCoverageOnHover:false
 });
 cluster.addLayer(geo);
 return cluster;
}

async function fetchJson(file){
 const r=await fetch('./'+encodeURIComponent(file),{cache:'no-store'});
 if(!r.ok)throw new Error(file+' HTTP '+r.status);
 return r.json();
}

// ---------- Oaza boundary ----------
fetchJson('kyoukai.geojson').then(data=>{
 const layer=L.geoJSON(data,{
   pane:'boundaryPane',
   style:{color:'#2e7d32',weight:1.3,dashArray:'4,4',fillOpacity:0},
   onEachFeature:(f,l)=>{
     const p=f.properties||{};
     p._search=(p['大字']||'')+' '+(p['市町村']||'');
     const c=l.getBounds?l.getBounds().getCenter():null;
     l.bindPopup(propsHtml('大字境界',p,c));
   }
 });
 ctl.addOverlay(layer,'大字境界');
 addSearch(layer,'_search','🗺 大字','#2e7d32',15);
}).catch(console.error);

// ---------- Shelter ----------
fetchJson('17000_1.geojson').then(data=>{
 const icon=L.divIcon({
   html:'<div class="map-symbol shelter-symbol">避</div>',
   className:'map-symbol-wrapper',iconSize:[30,30],iconAnchor:[15,15]
 });
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>{
     const p=f.properties||{};
     p._search=p['施設・場所名']||p['名称']||'';
     return L.marker(ll,{icon,title:p._search});
   },
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('指定避難場所',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo),'指定避難場所');
 addSearch(geo,'_search','🏫 避難所','#388e3c',17);
}).catch(console.error);

// ---------- Ponds ----------
fetchJson('ため池.geojson').then(data=>{
 const icon=L.divIcon({
   html:'<div class="map-symbol pond-symbol">💧</div>',
   className:'map-symbol-wrapper',iconSize:[30,30],iconAnchor:[15,15]
 });
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>{
     const p=f.properties||{};
     p._search=p.name||p['名称']||p.Name||'';
     return L.marker(ll,{icon,title:p._search});
   },
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('ため池',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo),'ため池');
 addSearch(geo,'_search','💧 ため池','#1976d2',18);
}).catch(console.error);

// ---------- Bus stops ----------
fetchJson('P11-22_17.geojson').then(data=>{
 const icon=L.divIcon({html:'🚌',className:'bus-icon',iconSize:[28,28],iconAnchor:[14,14]});
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>{
     const p=f.properties||{};
     const keys=['名称','停留所名','バス停名','name','Name'];
     p._search=keys.map(k=>p[k]).find(Boolean)||'';
     return L.marker(ll,{icon,title:p._search});
   },
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('バス停（令和4年）',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo),'バス停（令和4年）');
 addSearch(geo,'_search','🚌 バス停','#6a1b9a',18);
}).catch(console.error);

// ---------- Land price ----------
fetchJson('石川地価2025.geojson').then(data=>{
 const icon=L.divIcon({
   html:'<div class="map-symbol land-symbol">¥</div>',
   className:'map-symbol-wrapper',iconSize:[30,30],iconAnchor:[15,15]
 });
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>L.marker(ll,{icon}),
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('地価調査（2025年・石川）',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo),'地価調査（2025年・石川）');
}).catch(console.error);

// ---------- Bear sightings ----------
fetchJson('R7石川熊.geojson').then(data=>{
 const icon=L.divIcon({html:'🐻',className:'bear-icon',iconSize:[28,28],iconAnchor:[14,14]});
 const geo=L.geoJSON(data,{
   pane:'markersPane',
   pointToLayer:(f,ll)=>L.marker(ll,{icon}),
   onEachFeature:(f,l)=>l.bindPopup(propsHtml('くま目撃情報（2025年）',f.properties,l.getLatLng()))
 });
 ctl.addOverlay(clusterLayer(geo,17),'くま目撃情報（2025年）');
}).catch(console.error);

// ---------- Large-scale fill ----------
fetchJson('A54-23_17.geojson').then(data=>{
 const layer=L.geoJSON(data,{
   pane:'zonesPane',
   style:f=>{
     const v=String(f.properties?.A54_001??'');
     const color=v==='1'?'#43a047':v==='2'?'#fb8c00':v==='9'?'#8e24aa':'#757575';
     return {color,weight:2,fillColor:color,fillOpacity:.30};
   },
   onEachFeature:(f,l)=>{
     const c=l.getBounds?l.getBounds().getCenter():null;
     l.bindPopup(propsHtml('大規模盛土造成地（2023年）',f.properties,c));
   }
 });
 ctl.addOverlay(layer,'大規模盛土造成地（2023年）');
}).catch(console.error);

// ---------- Landslide hazard zones ----------
fetchJson('dosya.geojson').then(data=>{
 const zoneName=v=>String(v)==='1'?'土砂災害警戒区域（イエローゾーン）':
                         String(v)==='2'?'土砂災害特別警戒区域（レッドゾーン）':'土砂災害区域';
 const danger=L.geoJSON(data,{
   pane:'zonesPane',
   style:f=>{
     const v=String(f.properties?.A33_002??'');
     const c=v==='1'?'#ffff00':v==='2'?'#ff0000':'#888';
     return {color:c,weight:1.8,opacity:.95,fillColor:c,fillOpacity:.28};
   },
   onEachFeature:(f,l)=>{
     const p=f.properties||{};
     p._search=`${p.A33_004||''} ${p.A33_005||''} ${p.A33_009||''}`.trim();
     const c=l.getBounds?l.getBounds().getCenter():null;
     l.bindPopup(
       `<b>${zoneName(p.A33_002)}</b><br>`+
       `<b>箇所番号:</b> ${esc(p.A33_004||'-')}<br>`+
       `<b>箇所名:</b> ${esc(p.A33_005||'-')}`+
       `${p.A33_009?`<br><b>市町村:</b> ${esc(p.A33_009)}`:''}`+
       mapLinks(c)
     );
   }
 }).addTo(map);
 ctl.addOverlay(danger,'土砂災害警戒区域・特別警戒区域');
 addSearch(danger,'_search','⚠️ 土砂災害','#e53935',16);
}).catch(console.error);


// =====================================================
// 地図クリック地点の住所・緯度経度・平面直角座標
// 住所：国土地理院リバースジオコーダ
// 平面直角座標：市区町村コード先頭2桁の手書き対応表＋位置フォールバック
// 日本の測量表記に合わせ、X=北方向、Y=東方向として表示。
// =====================================================
let pointInfoSeq=0;
let lastPointInfo=null;

// JGD2011 平面直角座標系 I～XIX（EPSG:6669～6687）
const PLANE_SYSTEMS = {
  1:{roman:'I',epsg:'EPSG:6669',lat0:33,lon0:129.5},
  2:{roman:'II',epsg:'EPSG:6670',lat0:33,lon0:131},
  3:{roman:'III',epsg:'EPSG:6671',lat0:36,lon0:132+10/60},
  4:{roman:'IV',epsg:'EPSG:6672',lat0:33,lon0:133.5},
  5:{roman:'V',epsg:'EPSG:6673',lat0:36,lon0:134+20/60},
  6:{roman:'VI',epsg:'EPSG:6674',lat0:36,lon0:136},
  7:{roman:'VII',epsg:'EPSG:6675',lat0:36,lon0:137+10/60},
  8:{roman:'VIII',epsg:'EPSG:6676',lat0:36,lon0:138.5},
  9:{roman:'IX',epsg:'EPSG:6677',lat0:36,lon0:139+50/60},
 10:{roman:'X',epsg:'EPSG:6678',lat0:40,lon0:140+50/60},
 11:{roman:'XI',epsg:'EPSG:6679',lat0:44,lon0:140.25},
 12:{roman:'XII',epsg:'EPSG:6680',lat0:44,lon0:142.25},
 13:{roman:'XIII',epsg:'EPSG:6681',lat0:44,lon0:144.25},
 14:{roman:'XIV',epsg:'EPSG:6682',lat0:26,lon0:142},
 15:{roman:'XV',epsg:'EPSG:6683',lat0:26,lon0:127.5},
 16:{roman:'XVI',epsg:'EPSG:6684',lat0:26,lon0:124},
 17:{roman:'XVII',epsg:'EPSG:6685',lat0:26,lon0:131},
 18:{roman:'XVIII',epsg:'EPSG:6686',lat0:20,lon0:136},
 19:{roman:'XIX',epsg:'EPSG:6687',lat0:26,lon0:154}
};

if(window.proj4){
  Object.values(PLANE_SYSTEMS).forEach(s=>{
    proj4.defs(
      s.epsg,
      `+proj=tmerc +lat_0=${s.lat0} +lon_0=${s.lon0} +k=0.9999 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs`
    );
  });
}

// 都道府県コード → 都道府県名
const PREF_CODE_NAME = {
 '01':'北海道','02':'青森県','03':'岩手県','04':'宮城県','05':'秋田県','06':'山形県','07':'福島県',
 '08':'茨城県','09':'栃木県','10':'群馬県','11':'埼玉県','12':'千葉県','13':'東京都','14':'神奈川県',
 '15':'新潟県','16':'富山県','17':'石川県','18':'福井県','19':'山梨県','20':'長野県','21':'岐阜県',
 '22':'静岡県','23':'愛知県','24':'三重県','25':'滋賀県','26':'京都府','27':'大阪府','28':'兵庫県',
 '29':'奈良県','30':'和歌山県','31':'鳥取県','32':'島根県','33':'岡山県','34':'広島県','35':'山口県',
 '36':'徳島県','37':'香川県','38':'愛媛県','39':'高知県','40':'福岡県','41':'佐賀県','42':'長崎県',
 '43':'熊本県','44':'大分県','45':'宮崎県','46':'鹿児島県','47':'沖縄県'
};

// 通常の都道府県 → 平面直角座標系
const PREF_CODE_PLANE = {
 '02':10,'03':10,'04':10,'05':10,'06':10,
 '07':9,'08':9,'09':9,'10':9,'11':9,'12':9,'14':9,
 '15':8,'19':8,'20':8,'22':8,
 '16':7,'17':7,'21':7,'23':7,
 '18':6,'24':6,'25':6,'26':6,'27':6,'29':6,'30':6,
 '28':5,'31':5,'33':5,
 '36':4,'37':4,'38':4,'39':4,
 '32':3,'34':3,'35':3,
 '40':2,'41':2,'43':2,'44':2,'45':2,
 '42':1
};

function normalizeMuniCode(code){
  const s=String(code??'').replace(/\D/g,'');
  if(!s)return '';
  return s.padStart(5,'0');
}

function prefCodeFromMuni(code){
  const s=normalizeMuniCode(code);
  return s.length>=2 ? s.slice(0,2) : '';
}

function municipalityPartsFromCode(code){
  const prefCode=prefCodeFromMuni(code);
  const fallbackPref=PREF_CODE_NAME[prefCode]||'';

  try{
    const raw=window.GSI?.MUNI_ARRAY?.[String(code)] ||
              window.GSI?.MUNI_ARRAY?.[normalizeMuniCode(code)];
    if(raw){
      const parts=String(raw).split(',');
      return {
        pref:parts[1]||fallbackPref,
        muni:parts[3]||'',
        prefCode
      };
    }
  }catch(e){}

  return {pref:fallbackPref,muni:'',prefCode};
}

function planeSystemFromPrefCode(prefCode,lat,lng){
  // 北海道
  if(prefCode==='01'){
    if(lng < 141.5)return 11;
    if(lng < 143.5)return 12;
    return 13;
  }

  // 東京都
  if(prefCode==='13'){
    if(lat >= 33.5)return 9;
    if(lng >= 150)return 19;
    if(lat < 24)return 18;
    return 14;
  }

  // 鹿児島県
  if(prefCode==='46'){
    const islandZone1=(lat>=27 && lat<=32 && lng>=128.3 && lng<=130.3);
    return islandZone1 ? 1 : 2;
  }

  // 沖縄県
  if(prefCode==='47'){
    if(lng < 126)return 16;
    if(lng > 130)return 17;
    return 15;
  }

  return PREF_CODE_PLANE[prefCode] || null;
}

// 住所コードが取れない場合の位置フォールバック
function planeSystemFromLatLngFallback(lat,lng){
  // 石川・富山・岐阜西部付近 → VII系
  if(lat>=35.2 && lat<=38.2 && lng>=135.8 && lng<=138.1)return 7;

  // 長野・山梨・静岡東部付近 → VIII系
  if(lat>=34.4 && lat<=37.6 && lng>138.1 && lng<=139.7)return 8;

  // 千葉・関東付近 → IX系
  if(lat>=34.5 && lat<=37.6 && lng>139.0 && lng<=141.1)return 9;

  // 北海道
  if(lat>=41.3 && lat<=45.8){
    if(lng<141.5)return 11;
    if(lng<143.5)return 12;
    return 13;
  }

  return null;
}

function toPlaneRect(lat,lng,systemNo){
  if(!window.proj4 || !systemNo)return null;
  const sys=PLANE_SYSTEMS[systemNo];
  if(!sys)return null;

  try{
    const [easting,northing]=proj4('EPSG:4326',sys.epsg,[lng,lat]);
    if(!Number.isFinite(easting)||!Number.isFinite(northing))return null;
    return {
      systemNo,
      roman:sys.roman,
      epsg:sys.epsg,
      x:northing,
      y:easting
    };
  }catch(e){
    console.warn('平面直角座標変換に失敗:',e);
    return null;
  }
}

function renderPointInfo(panel,info,addressText,note=''){
  const plane=info.plane;
  const planeHtml=plane
    ? `<div class="plane-coord">平面直角座標 第${plane.roman}系（JGD2011）<br>`+
      `X：${plane.x.toFixed(3)} m<br>`+
      `Y：${plane.y.toFixed(3)} m</div>`
    : `<div class="plane-coord">平面直角座標：系番号を判定できません</div>`;

  panel.innerHTML=
    `<div class="point-title">クリック地点</div>`+
    `<div class="point-address">住所：${addressText}</div>`+
    `<div class="point-coord">緯度：${info.lat.toFixed(7)}<br>経度：${info.lng.toFixed(7)}</div>`+
    planeHtml+
    (note ? `<div class="point-note">${note}</div>` : '');
}

async function showClickedPointInfo(latlng){
  if(!latlng)return;

  const panel=document.getElementById('pointinfo');
  if(!panel)return;

  const lat=Number(latlng.lat);
  const lng=Number(latlng.lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return;

  const seq=++pointInfoSeq;

  // 住所取得前でも位置から系番号を仮判定
  const fallbackSystem=planeSystemFromLatLngFallback(lat,lng);
  const fallbackPlane=toPlaneRect(lat,lng,fallbackSystem);

  lastPointInfo={
    lat,lng,plane:fallbackPlane,address:'',pref:'',muni:''
  };

  panel.style.display='block';
  renderPointInfo(
    panel,
    lastPointInfo,
    '取得中…',
    fallbackPlane
      ? `平面直角座標：位置から第${fallbackPlane.roman}系を仮判定`
      : '住所取得後に平面直角座標系を判定します'
  );

  try{
    const url=
      `https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}`;
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const j=await r.json();

    if(seq!==pointInfoSeq)return;

    const result=j?.results||{};
    const parts=municipalityPartsFromCode(result.muniCd);
    const town=String(result.lv01Nm||'').trim();
    const address=`${parts.pref}${parts.muni}${town}`.trim();

    let systemNo=planeSystemFromPrefCode(parts.prefCode,lat,lng);
    if(!systemNo)systemNo=planeSystemFromLatLngFallback(lat,lng);

    const plane=toPlaneRect(lat,lng,systemNo);

    lastPointInfo.address=address;
    lastPointInfo.pref=parts.pref;
    lastPointInfo.muni=parts.muni;
    lastPointInfo.plane=plane;

    const planeNote=plane
      ? `平面直角座標系：第${plane.roman}系（${plane.epsg}）`
      : '平面直角座標系を判定できませんでした';

    renderPointInfo(
      panel,
      lastPointInfo,
      address ? esc(address) : (town ? esc(town) : '住所情報なし'),
      `住所：国土地理院リバースジオコーダ ／ ${planeNote}`
    );
  }catch(err){
    if(seq!==pointInfoSeq)return;

    renderPointInfo(
      panel,
      lastPointInfo,
      '取得できませんでした',
      lastPointInfo.plane
        ? `住所取得失敗 ／ 平面直角座標は位置から第${lastPointInfo.plane.roman}系を判定`
        : '住所・平面直角座標系を判定できませんでした'
    );
    console.warn('住所の逆ジオコーディングに失敗:',err);
  }
}

// レイヤーのクリックイベントを邪魔せず、クリック位置だけcapture段階で取得する。
map.getContainer().addEventListener('click',ev=>{
  const target=ev.target;
  if(target?.closest?.('.leaflet-control,.leaflet-popup,.leaflet-tooltip,#pointinfo'))return;

  try{
    const latlng=map.mouseEventToLatLng(ev);
    showClickedPointInfo(latlng);
  }catch(e){}
},true);

if(L.control.locate){
 L.control.locate({
   position:'topleft',
   flyTo:true,
   keepCurrentZoomLevel:false,
   strings:{title:'現在地を表示'},
   locateOptions:{enableHighAccuracy:true}
 }).addTo(map);
}
