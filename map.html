<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noto CSMap + 土砂災害 + 避難所 + ため池 + バス停（検索対応）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html,body{height:100%;margin:0}
  #map{height:100%;background:#f3f3f3}
  .legend{background:#fff;padding:6px 10px;line-height:18px;box-shadow:0 0 15px rgba(0,0,0,.2)}
  .legend i{width:18px;height:18px;float:left;margin-right:8px;opacity:.9}
  .bus-icon{font-size:22px;width:26px;height:26px;line-height:26px;text-align:center;transform:translate(-13px,-13px);text-shadow:0 0 2px rgba(255,255,255,.85)}
  #msg{position:absolute;left:0;right:0;top:8px;text-align:center;color:#666;font:14px/1.6 system-ui;z-index:9999}
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">地図を初期化中…</div>

<script>
/* --- 多段ローダ（jsDelivr → unpkg → cdnjs） --- */
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ng;document.head.appendChild(s);});}
(async()=>{
  try{
    // Leaflet本体
    try{ await loadScript("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"); }
    catch{ try{ await loadScript("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"); }
    catch{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"); } }

    // プラグイン
    const libs = [
      "https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js",
      "https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.0/dist/L.Control.Locate.min.js",
      "https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    ];
    for (const u of libs) { try{ await loadScript(u); } catch(e){ console.warn('load fail', u, e);} }

    init();
  }catch(e){
    document.getElementById('msg').textContent = '必要なスクリプトの読み込みに失敗しました。ネットワーク/プロキシをご確認ください。';
    console.warn(e);
  }
})();

function init(){
  const msg = document.getElementById('msg'); if (msg) msg.remove();
  const map = L.map('map').setView([37.3,136.9],11);

  /* ユーティリティ */
  const z2h = s => (s ?? '').toString().replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/\s+/g,' ').trim();
  const setTitle = (layerOrFeat, title) => {
    const t = z2h(title);
    if (layerOrFeat?.options) layerOrFeat.options.title = t;
    if (layerOrFeat?.feature?.properties) layerOrFeat.feature.properties.title = t;
    else if (layerOrFeat?.properties) layerOrFeat.properties.title = t;
    return t;
  };

  /* panes */
  map.createPane('boundaryPane');  map.getPane('boundaryPane').style.zIndex = 421;
  map.createPane('palePane');      map.getPane('palePane').style.zIndex = 425;
  map.createPane('zonesPane');     map.getPane('zonesPane').style.zIndex = 428;
  map.createPane('markersPane');   map.getPane('markersPane').style.zIndex = 430;

  /* 背景 */
  const notoCS = L.tileLayer('https://rinya.geospatial.jp/tile/csmaptile_noto/{z}/{x}/{y}.png', {
    maxZoom:18, attribution:'© 林野庁'
  }).addTo(map);
  const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
    maxZoom:18, opacity:.6, pane:'palePane', attribution:'© 国土地理院'
  });
  const ctl = L.control.layers({'Noto CSMap':notoCS},{'淡色地図':gsiPale},{collapsed:false}).addTo(map);
  L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

  /* 大字 */
  fetch('https://raw.githubusercontent.com/eronex1181/noto-map/main/kyoukai.geojson',{cache:'no-store'})
  .then(r=>r.json()).then(data=>{
    const boundaryLayer = L.geoJSON(data,{
      pane:'boundaryPane',
      style:()=>({color:'green',dashArray:'4,4',weight:1.5,opacity:1}),
      onEachFeature:(f,l)=>{const p=f.properties??{}; setTitle(l,`${p['大字']??''} ${p['市町村']??''}`);
        l.bindPopup(`<b>大字:</b> ${p['大字']??'-'}<br><b>市町村:</b> ${p['市町村']??'-'}`);}
    }).addTo(map);
    ctl.addOverlay(boundaryLayer,'大字境界');
    new L.Control.Search({layer:boundaryLayer,propertyName:'title',textPlaceholder:'大字/市町村',marker:false,zoom:14}).addTo(map);
  });

  /* 土砂災害 */
  fetch('https://raw.githubusercontent.com/eronex1181/noto-map/main/dosya.geojson',{cache:'no-store'})
  .then(r=>r.json()).then(data=>{
    const col=v=>(v==1||v==='1')?'#ffff00':(v==2||v==='2')?'#ff0000':'#888';
    const nm=v=>(v==1||v==='1')?'イエローゾーン':(v==2||v==='2')?'レッドゾーン':'その他';
    const danger = L.geoJSON(data,{
      pane:'zonesPane',
      style:f=>({color:col(f.properties.A33_002),weight:2,opacity:.9,fillOpacity:.25}),
      onEachFeature:(f,l)=>{const p=f.properties??{}; setTitle(l,`${p.A33_004??''} ${p.A33_005??''}`);
        l.bindPopup(`<b>${nm(p.A33_002)}</b><br><b>箇所番号:</b> ${p.A33_004??'-'}<br><b>箇所名:</b> ${p.A33_005??'-'}`+(p.A33_009?`<br><b>市町村:</b> ${p.A33_009}`:''));}
    }).addTo(map);
    ctl.addOverlay(danger,'土砂災害警戒区域');
    new L.Control.Search({layer:danger,propertyName:'title',textPlaceholder:'箇所番号/箇所名',marker:false,zoom:16}).addTo(map);
  });

  /* 避難場所 */
  fetch('https://raw.githubusercontent.com/eronex1181/noto-map/main/17000_1.geojson',{cache:'no-store'})
  .then(r=>r.json()).then(data=>{
    const ic = L.icon({iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png',iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[0,-35]});
    const layer = L.geoJSON(data,{
      pane:'markersPane',
      pointToLayer:(f,latlng)=>{const p=f.properties??{}; const n=p['名称']??p['name']??p['Name']??''; const m=L.marker(latlng,{icon:ic}); setTitle(m,n); return m;},
      onEachFeature:(f,l)=>l.bindPopup(`<b>指定避難場所</b><br>${Object.entries(f.properties??{}).map(([k,v])=>`<b>${k}:</b> ${v}`).join('<br>')}`)
    }).addTo(map);
    ctl.addOverlay(layer,'指定避難場所（更新2025-07-09）');
    new L.Control.Search({layer,propertyName:'title',textPlaceholder:'避難所名',zoom:17,marker:false}).addTo(map);
  });

  /* ため池（クラスタ） */
  fetch('https://raw.githubusercontent.com/eronex1181/noto-map/main/%E3%81%9F%E3%82%81%E6%B1%A0.geojson',{cache:'no-store'})
  .then(r=>r.json()).then(data=>{
    const ic = L.icon({iconUrl:'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-blue.png',iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[0,-35]});
    const cluster = L.markerClusterGroup({pane:'markersPane',disableClusteringAtZoom:16,spiderfyOnMaxZoom:true,showCoverageOnHover:false});
    const sub = L.geoJSON(data,{
      pane:'markersPane',
      pointToLayer:(f,latlng)=>{const p=f.properties??{}; const n=p.name??p['名称']??p['Name']??''; const m=L.marker(latlng,{icon:ic}); setTitle(m,n); return m;},
      onEachFeature:(f,l)=>{const p=f.properties??{}; const n=p.name??p.名称??p.Name??''; const skip=new Set(['name','名称','Name']);
        const rest=Object.entries(p).filter(([k])=>!skip.has(k)).map(([k,v])=>`<b>${k}:</b> ${v}`).join('<br>');
        l.bindPopup(`<b>ため池</b>${n?`<br><b>name:</b> ${n}`:''}${rest?`<br>${rest}`:''}`);}
    });
    cluster.addLayer(sub); map.addLayer(cluster); ctl.addOverlay(cluster,'ため池（クラスタ）');
    new L.Control.Search({layer:sub,propertyName:'title',textPlaceholder:'ため池名',zoom:18,marker:false}).addTo(map);
  });

  /* バス停 */
  fetch('https://raw.githubusercontent.com/eronex1181/noto-map/main/P11-22_17.geojson?_=now',{cache:'no-store'})
  .then(r=>r.json()).then(data=>{
    const ic = L.divIcon({html:'🚌',className:'bus-icon',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-12]});
    const pick = (p)=>{const ks=['名称','停留所名','バス停名','name','Name','停名','停留所'];for(const k of ks){if(p&&p[k])return z2h(p[k]);}
      for(const [k,v] of Object.entries(p??{})){if(typeof v==='string'&&v.trim()) return z2h(v);} return '';};
    const layer = L.geoJSON(data,{
      pane:'markersPane',
      pointToLayer:(f,latlng)=>{const m=L.marker(latlng,{icon:ic}); setTitle(m,pick(f.properties??{})); return m;},
      onEachFeature:(f,l)=>{const p=f.properties??{}; const n=pick(p); const skip=new Set(['名称','停留所名','バス停名','name','Name','停名','停留所']);
        const rows=Object.entries(p).filter(([k])=>!skip.has(k)).map(([k,v])=>`<b>${k}:</b> ${v}`).join('<br>');
        l.bindPopup(`<b>バス停（令和4年）</b>${n?`<br><b>名称:</b> ${n}`:''}${rows?`<br>${rows}`:''}`);}
    }).addTo(map);
    ctl.addOverlay(layer,'バス停（令和4年）');
    new L.Control.Search({layer,propertyName:'title',textPlaceholder:'バス停名',zoom:18,marker:false}).addTo(map);
  });

  /* 凡例 & 現在地 */
  const legend=L.control({position:'bottomright'}); legend.onAdd=()=>{const d=L.DomUtil.create('div','legend'); d.innerHTML =
    '<i style="background:#ffff00;"></i> イエローゾーン<br>'+
    '<i style="background:#ff0000;"></i> レッドゾーン<br>'+
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png" style="height:18px;vertical-align:middle;margin-right:6px;"> 指定避難場所<br>'+
    '<img src="https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-blue.png" style="height:18px;vertical-align:middle;margin-right:6px;"> ため池<br>'+
    '<span style="font-size:18px;vertical-align:middle;margin-right:6px;">🚌</span> バス停（令和4年）'; return d; };
  legend.addTo(map);
  if (L.control.locate){ L.control.locate({position:'topleft',flyTo:true,strings:{title:'現在地を表示'},locateOptions:{enableHighAccuracy:true}}).addTo(map); }
}
</script>
</body>
</html>
